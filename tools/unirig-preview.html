<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UniRig Character Preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101413; color: #edf2ef; font: 14px/1.4 system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    .toolbar { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; width: fit-content; max-width: calc(100vw - 24px); padding: 6px; background: rgba(12, 16, 15, .9); border: 1px solid #39433f; border-radius: 6px; }
    button, select { min-height: 34px; padding: 0 12px; border: 1px solid #4a5752; border-radius: 4px; background: #202725; color: inherit; cursor: pointer; }
    button:hover { background: #2a3430; }
    button[aria-pressed="true"] { border-color: #9dd9b7; color: #bceacb; }
    input[type="range"] { width: min(240px, 32vw); accent-color: #9dd9b7; }
    .status { position: fixed; left: 12px; bottom: 12px; max-width: min(520px, calc(100vw - 24px)); padding: 8px 10px; background: rgba(12, 16, 15, .9); border: 1px solid #39433f; border-radius: 4px; }
  </style>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"}}
  </script>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="toolbar">
    <button data-view="front" aria-pressed="true">正面</button>
    <button data-view="left" aria-pressed="false">侧面</button>
    <button data-view="back" aria-pressed="false">背面</button>
    <button id="skeleton" aria-pressed="true">骨架</button>
    <select id="clip" aria-label="动作"></select>
    <button id="play" aria-pressed="true">暂停</button>
    <input id="time" type="range" min="0" max="1" step="0.001" value="0" aria-label="动作时间">
  </div>
  <div class="status" id="status">加载中</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const canvas = document.querySelector('#canvas');
    const status = document.querySelector('#status');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setClearColor(0x101413, 1);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(34, 1, 0.01, 100);
    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.target.set(0, 0.85, 0);

    scene.add(new THREE.HemisphereLight(0xf2f7f4, 0x26342e, 2.4));
    const key = new THREE.DirectionalLight(0xffe3cc, 3.1);
    key.position.set(4, 6, 5);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xdde8ff, 1.6);
    fill.position.set(-5, 3, 4);
    scene.add(fill);
    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(1.8, 64),
      new THREE.MeshStandardMaterial({ color: 0x27302d, roughness: 1 })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const params = new URLSearchParams(location.search);
    const modelFile = params.get('model') || 'popbot-hunyuan-v31-unirig-rigged.glb';
    const skeletonFile = params.get('skeleton');
    const frontZ = Number(params.get('frontZ') || -1);
    const lockRootMotion = params.get('lockRoot') !== '0';
    const requestedTime = params.has('time') ? Number(params.get('time')) : null;
    const requestedTargetY = params.has('targetY') ? Number(params.get('targetY')) : null;
    const requestedDistance = params.has('distance') ? Number(params.get('distance')) : null;
    if (!/^[a-z0-9._-]+\.glb$/i.test(modelFile)) throw new Error('Invalid model filename');
    if (skeletonFile && !/^[a-z0-9._-]+\.json$/i.test(skeletonFile)) throw new Error('Invalid skeleton filename');
    if (![1, -1].includes(frontZ)) throw new Error('frontZ must be 1 or -1');
    if (requestedTime !== null && (!Number.isFinite(requestedTime) || requestedTime < 0 || requestedTime > 1)) throw new Error('time must be between 0 and 1');
    if (requestedTargetY !== null && (!Number.isFinite(requestedTargetY) || requestedTargetY < 0 || requestedTargetY > 4)) throw new Error('targetY must be between 0 and 4');
    if (requestedDistance !== null && (!Number.isFinite(requestedDistance) || requestedDistance < 0.2 || requestedDistance > 20)) throw new Error('distance must be between 0.2 and 20');
    const gltf = await new GLTFLoader().loadAsync(`../generated/${modelFile}`);
    const root = gltf.scene;
    const mixer = new THREE.AnimationMixer(root);
    const clock = new THREE.Clock();
    scene.add(root);
    root.updateMatrixWorld(true);

    const restTransforms = new Map();
    root.traverse(object => restTransforms.set(object, {
      position: object.position.clone(),
      quaternion: object.quaternion.clone(),
      scale: object.scale.clone(),
    }));

    const box = new THREE.Box3().setFromObject(root);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    root.position.sub(center);
    root.position.y += size.y / 2;
    root.updateMatrixWorld(true);
    const bindRootPosition = root.position.clone();
    floor.position.y = 0;
    camera.position.set(0, Math.max(0.72, size.y * 0.58), 4.2);
    controls.target.set(0, size.y * 0.5, 0);

    const bones = {};
    root.traverse(object => {
      if (object.isBone) bones[object.name] = object;
    });
    const motionAnchor = bones.base
      || bones.pelvis
      || bones.Hips
      || bones['mixamorig:Hips']
      || null;
    const bindAnchorWorld = motionAnchor ? motionAnchor.getWorldPosition(new THREE.Vector3()) : null;
    const currentAnchorWorld = new THREE.Vector3();
    const helper = new THREE.SkeletonHelper(root);
    helper.visible = false;
    scene.add(helper);

    const overlay = new THREE.Group();
    overlay.name = 'UniRigJsonSkeleton';
    let overlayBoneCount = 0;
    if (skeletonFile) {
      const payload = await fetch(`../generated/${skeletonFile}`).then(response => {
        if (!response.ok) throw new Error(`Skeleton request failed: ${response.status}`);
        return response.json();
      });
      const linePositions = [];
      const lineColors = [];
      const jointPositions = [];
      const converted = point => [point[0], point[2], point[1]];
      const boneByName = new Map((payload.bones || []).map(bone => [bone.name, bone]));
      const colorFor = name => {
        const index = Number(name.split('_')[1]);
        if (index <= 5) return new THREE.Color(0x8ee6a8);
        if (index <= 25) return new THREE.Color(0xffb45b);
        return new THREE.Color(0x67c9ff);
      };
      for (const bone of payload.bones || []) {
        const head = converted(bone.head);
        const parent = bone.parent ? boneByName.get(bone.parent) : null;
        const start = parent ? converted(parent.head) : head;
        const end = parent ? head : converted(bone.tail);
        const color = colorFor(bone.name);
        linePositions.push(...start, ...end);
        lineColors.push(...color.toArray(), ...color.toArray());
        jointPositions.push(...head);
      }
      const lines = new THREE.BufferGeometry();
      lines.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
      lines.setAttribute('color', new THREE.Float32BufferAttribute(lineColors, 3));
      overlay.add(new THREE.LineSegments(lines, new THREE.LineBasicMaterial({
        vertexColors: true,
        depthTest: false,
        transparent: true,
        opacity: 0.96,
      })));
      const joints = new THREE.BufferGeometry();
      joints.setAttribute('position', new THREE.Float32BufferAttribute(jointPositions, 3));
      overlay.add(new THREE.Points(joints, new THREE.PointsMaterial({
        color: 0xffffff,
        size: Math.max(0.018, size.y * 0.012),
        depthTest: false,
        sizeAttenuation: true,
      })));
      overlayBoneCount = payload.boneCount || 0;
      root.add(overlay);
    }
    const skeletonButton = document.querySelector('#skeleton');
    overlay.visible = overlayBoneCount > 0;
    skeletonButton.setAttribute('aria-pressed', String(overlayBoneCount > 0));

    let currentView = 'front';
    let activeAction = null;
    let activeClip = null;
    let playing = true;
    const clipSelect = document.querySelector('#clip');
    const playButton = document.querySelector('#play');
    const timeSlider = document.querySelector('#time');

    function updateStatus() {
      const clipLabel = activeClip ? activeClip.name : 'bind pose';
      const clipTime = activeAction && activeClip ? `${activeAction.time.toFixed(2)}/${activeClip.duration.toFixed(2)}s` : '0.00s';
      status.textContent = [
        modelFile,
        `${currentView} view`,
        clipLabel,
        clipTime,
        `${overlayBoneCount || Object.keys(bones).length} bones`,
        `${Math.round(size.y * 100) / 100} m bounds`,
        lockRootMotion ? 'root locked' : 'root motion',
        `viewport ${innerWidth}x${innerHeight}`,
      ].join(' | ');
    }

    function stabilizeForReview() {
      root.position.copy(bindRootPosition);
      root.updateMatrixWorld(true);
      if (!lockRootMotion || !motionAnchor || !bindAnchorWorld) return;
      motionAnchor.getWorldPosition(currentAnchorWorld);
      root.position.sub(currentAnchorWorld.sub(bindAnchorWorld));
      root.updateMatrixWorld(true);
    }

    function restoreBindPose() {
      mixer.stopAllAction();
      activeAction = null;
      activeClip = null;
      for (const [object, transform] of restTransforms) {
        object.position.copy(transform.position);
        object.quaternion.copy(transform.quaternion);
        object.scale.copy(transform.scale);
      }
      stabilizeForReview();
      timeSlider.value = '0';
      updateStatus();
    }

    function setClip(name) {
      mixer.stopAllAction();
      if (!name) {
        restoreBindPose();
        return;
      }
      activeClip = gltf.animations.find(clip => clip.name === name) || null;
      if (!activeClip) throw new Error(`Unknown animation clip: ${name}`);
      activeAction = mixer.clipAction(activeClip).reset().play();
      activeAction.paused = !playing;
      timeSlider.value = '0';
      mixer.update(0);
      stabilizeForReview();
      updateStatus();
    }

    function setNormalizedTime(value) {
      if (!activeAction || !activeClip) return;
      activeAction.time = Math.max(0, Math.min(1, Number(value))) * activeClip.duration;
      mixer.update(0);
      stabilizeForReview();
      timeSlider.value = String(value);
      updateStatus();
    }

    function setPlaying(value) {
      playing = Boolean(value);
      if (activeAction) activeAction.paused = !playing;
      playButton.textContent = playing ? '暂停' : '播放';
      playButton.setAttribute('aria-pressed', String(playing));
      updateStatus();
    }

    clipSelect.append(new Option('绑定姿势', ''));
    for (const clip of gltf.animations) clipSelect.append(new Option(clip.name, clip.name));
    const requestedClip = params.get('clip');
    clipSelect.value = requestedClip && gltf.animations.some(clip => clip.name === requestedClip) ? requestedClip : '';

    function setView(name) {
      currentView = name;
      const distance = requestedDistance ?? Math.max(3.2, size.y * 2.1);
      const targetY = requestedTargetY ?? size.y * 0.5;
      if (name === 'left') camera.position.set(distance * frontZ, targetY, 0);
      else if (name === 'back') camera.position.set(0, targetY, -distance * frontZ);
      else camera.position.set(0, targetY, distance * frontZ);
      controls.target.set(0, targetY, 0);
      controls.update();
      document.querySelectorAll('[data-view]').forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.view === name));
      });
      updateStatus();
    }

    document.querySelectorAll('[data-view]').forEach(button => {
      button.addEventListener('click', () => setView(button.dataset.view));
    });
    skeletonButton.addEventListener('click', event => {
      const visible = overlayBoneCount ? !overlay.visible : !helper.visible;
      overlay.visible = visible;
      helper.visible = visible && !overlayBoneCount;
      event.currentTarget.setAttribute('aria-pressed', String(visible));
    });
    clipSelect.addEventListener('change', () => setClip(clipSelect.value));
    playButton.addEventListener('click', () => setPlaying(!playing));
    timeSlider.addEventListener('input', () => {
      setPlaying(false);
      setNormalizedTime(timeSlider.value);
    });

    window.unirigPreview = {
      root, bones, helper, overlay, mixer, setView, setClip, setNormalizedTime, setPlaying, renderer, scene, camera,
    };
    setView('front');
    setClip(clipSelect.value);
    if (requestedTime !== null && activeAction) {
      setPlaying(false);
      setNormalizedTime(requestedTime);
    }

    function resize() {
      const width = innerWidth;
      const height = innerHeight;
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize);
    resize();

    let lastPlaybackUiUpdate = 0;
    renderer.setAnimationLoop(frameTime => {
      const delta = clock.getDelta();
      if (activeAction && playing) {
        mixer.update(delta);
        stabilizeForReview();
        if (frameTime - lastPlaybackUiUpdate >= 100) {
          timeSlider.value = String(activeClip.duration > 0 ? activeAction.time / activeClip.duration : 0);
          updateStatus();
          lastPlaybackUiUpdate = frameTime;
        }
      }
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
