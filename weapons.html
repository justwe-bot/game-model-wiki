<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101513">
  <title>又一个僵尸幸存者 · 武器图鉴</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <style>
    :root {
      color-scheme: dark;
      --bg: #101513; --side: #151c19; --surface: #1a231f; --surface-2: #202b26;
      --line: #34413b; --line-soft: #27322d; --text: #f1f4ec; --muted: #a7b1aa;
      --faint: #748078; --lime: #bddb6b; --coral: #f08366; --amber: #efbb61;
      font-family: Inter, "Microsoft YaHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body { min-height: 100vh; overflow: hidden; }
    button, input, select { font: inherit; }
    button, a { color: inherit; }
    .app { height: 100vh; min-height: 0; overflow: hidden; display: grid; grid-template-columns: 292px minmax(0, 1fr); }
    .catalog { min-width: 0; min-height: 0; overflow: hidden; border-right: 1px solid var(--line); background: var(--side); display: flex; flex-direction: column; }
    .catalog-head { padding: 20px 16px 14px; border-bottom: 1px solid var(--line-soft); }
    .brand { margin: 0; font-size: 19px; font-weight: 800; }
    .edition { margin: 5px 0 16px; color: var(--muted); font-size: 12px; }
    .game-switcher { position: relative; margin: 14px 0 10px; }
    .game-switcher select { width: 100%; height: 38px; appearance: none; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--text); padding: 0 34px 0 11px; outline: 0; cursor: pointer; }
    .game-switcher svg { position: absolute; right: 10px; top: 11px; width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
    .view-tabs { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 10px; }
    #creaturesLink, #mapsLink, #soundsLink, #propsLink { display: none; }
    .view-tabs.models-available #creaturesLink { display: flex; }
    .view-tabs.maps-available #mapsLink { display: flex; }
    .view-tabs.sounds-available #soundsLink { display: flex; }
    .view-tabs.props-available #propsLink { display: flex; }
    .view-tab { flex: 1 1 72px; height: 34px; border: 1px solid var(--line); border-radius: 5px; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 7px; text-decoration: none; font-size: 12px; }
    .view-tab.active { color: #17200e; background: var(--lime); border-color: var(--lime); font-weight: 800; }
    .view-tab svg { width: 15px; height: 15px; }
    .search { height: 38px; display: flex; align-items: center; gap: 9px; padding: 0 11px; border: 1px solid var(--line); border-radius: 6px; background: #101613; }
    .search svg { width: 16px; height: 16px; color: var(--muted); flex: 0 0 auto; }
    .search input { width: 100%; min-width: 0; border: 0; outline: 0; color: var(--text); background: transparent; }
    .search input::placeholder { color: var(--faint); }
    .tier-filters { max-height: 86px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; margin-top: 10px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
    .tier-filter { border: 1px solid var(--line); border-radius: 5px; background: transparent; color: var(--muted); padding: 6px 9px; cursor: pointer; font-size: 12px; }
    .tier-filter.active { color: #17200e; background: var(--lime); border-color: var(--lime); font-weight: 800; }
    .weapon-list { min-height: 0; flex: 1; padding: 10px; display: grid; align-content: start; gap: 5px; overflow-y: auto; overscroll-behavior: contain; }
    .weapon-entry { min-height: 58px; width: 100%; border: 1px solid transparent; border-radius: 6px; background: transparent; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 10px; align-items: center; padding: 9px 10px; text-align: left; cursor: pointer; }
    .weapon-entry:hover { background: var(--surface); }
    .weapon-entry.active { background: var(--surface-2); border-color: var(--line); }
    .weapon-entry strong, .weapon-entry small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .weapon-entry strong { font-size: 14px; }
    .weapon-entry small { grid-column: 1; color: var(--muted); }
    .weapon-entry span { grid-column: 2; grid-row: 1 / span 2; color: var(--lime); font-size: 11px; }
    .empty { color: var(--muted); padding: 20px 10px; font-size: 13px; }
    .workspace { min-width: 0; min-height: 0; height: 100vh; overflow-y: auto; overscroll-behavior: contain; display: grid; grid-template-rows: minmax(420px, 56vh) auto; }
    .stage { min-height: 420px; position: sticky; z-index: 2; top: 0; overflow: hidden; background:
      radial-gradient(circle at 18% 20%, rgba(189, 219, 107, .08), transparent 28%),
      radial-gradient(circle at 82% 78%, rgba(240, 131, 102, .08), transparent 26%),
      #0a100e; display: grid; place-items: center; padding: 96px 28px 96px; }
    .stage-head { position: absolute; z-index: 3; top: 18px; left: 20px; right: 20px; display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; pointer-events: none; }
    .identity h1 { margin: 0; max-width: min(62vw, 780px); font-size: clamp(30px, 4.5vw, 54px); line-height: 1; overflow-wrap: anywhere; }
    .identity p { margin: 7px 0 0; color: var(--muted); font-size: 14px; }
    .tier-badge { padding: 7px 10px; border: 1px solid var(--line); border-radius: 5px; background: rgba(16, 21, 19, .86); color: var(--lime); font-size: 12px; white-space: nowrap; }
    .audition { width: min(720px, 100%); display: grid; gap: 14px; }
    .audition-head { display: flex; align-items: center; gap: 14px; }
    .play-button { flex: 0 0 auto; width: 68px; height: 68px; border: 0; border-radius: 50%; background: var(--lime); color: #17200e; display: grid; place-items: center; cursor: pointer; box-shadow: 0 0 0 10px rgba(189, 219, 107, .12); }
    .play-button:hover { transform: scale(1.03); }
    .play-button svg { width: 27px; height: 27px; }
    .audition-info { min-width: 0; display: grid; gap: 3px; }
    .audition-info b { font-size: 16px; }
    .audition-info span { color: var(--muted); font-size: 12px; }
    .transport { display: grid; gap: 8px; }
    .progress { appearance: none; width: 100%; height: 6px; border-radius: 99px; background: #22302a; outline: 0; }
    .progress::-webkit-slider-thumb { appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--lime); }
    .times { display: flex; justify-content: space-between; color: var(--faint); font-size: 12px; }
    .stage-tools { position: absolute; z-index: 4; left: 20px; right: 20px; bottom: 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .icon-tools { padding: 4px; border: 1px solid var(--line); border-radius: 6px; background: rgba(16, 21, 19, .88); display: flex; gap: 3px; }
    .icon-button { width: 34px; height: 34px; padding: 0; border: 0; border-radius: 4px; background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--muted); }
    .icon-button:hover, .icon-button.active { background: var(--surface-2); color: var(--text); }
    .icon-button svg { width: 17px; height: 17px; }
    .details { border-top: 1px solid var(--line); padding: 24px clamp(20px, 3.5vw, 48px) 38px; display: grid; grid-template-columns: minmax(270px, .8fr) minmax(420px, 1.2fr); gap: 38px 50px; }
    .details h2 { margin: 0 0 10px; font-size: 18px; }
    .details p { margin: 0; color: var(--muted); line-height: 1.7; }
    .stats { margin-top: 20px; border-top: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); display: grid; grid-template-columns: repeat(3, 1fr); }
    .stat { padding: 14px 10px 14px 0; min-width: 0; }
    .stat b { display: block; font-size: 19px; overflow: hidden; text-overflow: ellipsis; }
    .stat span { display: block; margin-top: 3px; color: var(--faint); font-size: 11px; }
    .used-by { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
    .chip { padding: 5px 8px; border: 1px solid var(--line); border-radius: 5px; color: var(--amber); font-size: 12px; }
    .audio-list { display: grid; gap: 8px; }
    .copy-hint { margin: 0 0 12px; color: var(--faint); font-size: 12px; line-height: 1.6; }
    .audio-item { width: 100%; min-height: 66px; padding: 12px 14px; border: 1px solid var(--line-soft); border-radius: 6px; background: transparent; cursor: pointer; text-align: left; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 16px; }
    .audio-item:hover { border-color: var(--line); background: var(--surface); }
    .audio-item.active { border-color: var(--coral); background: #261f1c; }
    .audio-name { font-size: 15px; font-weight: 800; }
    .audio-meta { color: var(--amber); font-size: 11px; align-self: center; }
    .audio-summary { grid-column: 1 / -1; color: var(--muted); font-size: 13px; }
    .copy-preview { margin-top: 14px; max-height: 220px; overflow-y: auto; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 6px; background: #101613; color: var(--muted); font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 11px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; }
    .copy-preview b { color: var(--lime); font-weight: 700; }
    .toast { position: fixed; z-index: 20; left: 50%; bottom: 26px; transform: translate(-50%, 14px); padding: 9px 16px; border: 1px solid var(--lime); border-radius: 6px; background: #1b2417; color: var(--lime); font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .hit-section { grid-column: 1 / -1; }
    .hit-section h2 { margin: 0 0 10px; font-size: 18px; }
    .hit-layout { display: grid; grid-template-columns: minmax(320px, 460px) minmax(240px, 1fr); gap: 22px 30px; align-items: start; }
    .hit-canvas-wrap { position: relative; border: 1px solid var(--line-soft); border-radius: 8px; overflow: hidden; background: #0a100e; }
    .hit-canvas { width: 100%; height: auto; display: block; }
    .hit-badge { position: absolute; top: 9px; left: 11px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 5px; background: rgba(16, 21, 19, .86); color: var(--lime); font-size: 11px; }
    .hit-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .hit-button { height: 34px; padding: 0 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--text); cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 7px; }
    .hit-button:hover { border-color: var(--lime); color: var(--lime); }
    .hit-button.active { background: var(--lime); border-color: var(--lime); color: #17200e; font-weight: 700; }
    .hit-button svg { width: 15px; height: 15px; }
    .hit-meta { display: grid; gap: 8px; }
    .hit-line { display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: 8px; font-size: 12px; align-items: baseline; }
    .hit-line b { color: var(--lime); font-weight: 700; }
    .hit-line span { color: var(--muted); overflow-wrap: anywhere; }
    .hit-thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .hit-thumb { width: 62px; height: 62px; border: 1px solid var(--line-soft); border-radius: 6px; background: #0a100e url('') center/contain no-repeat; }
    .hit-note { margin-top: 12px; color: var(--faint); font-size: 11px; line-height: 1.7; }
    .hit-video { width: 100%; margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; background: #000; }
    @media (max-width: 900px) {
      .hit-layout { grid-template-columns: 1fr; }
    }
    .notice { grid-column: 1 / -1; padding-top: 14px; border-top: 1px solid var(--line-soft); color: var(--faint); font-size: 11px; }
    @media (max-width: 900px) {
      body { overflow: visible; }
      .app { display: block; height: auto; min-height: 100vh; overflow: visible; }
      .catalog { overflow: visible; border-right: 0; border-bottom: 1px solid var(--line); }
      .catalog-head { padding: 13px 12px 10px; }
      .edition { display: none; }
      .brand { font-size: 17px; }
      .tier-filters { max-height: none; flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
      .weapon-list { min-height: auto; flex: none; display: flex; overflow-x: auto; padding: 8px 10px 10px; scrollbar-width: none; }
      .weapon-entry { flex: 0 0 210px; min-width: 210px; grid-template-columns: minmax(0, 1fr); }
      .weapon-entry span { grid-column: 1; grid-row: auto; }
      .workspace { height: auto; overflow: visible; grid-template-rows: minmax(390px, 54vh) auto; }
      .stage { min-height: 390px; position: relative; padding: 84px 16px 84px; }
      .details { grid-template-columns: 1fr; gap: 26px; }
    }
    @media (max-width: 560px) {
      .identity h1 { max-width: 72vw; font-size: 31px; }
      .stage-head, .stage-tools { left: 14px; right: 14px; }
      .details { padding: 20px 15px 30px; }
      .stat b { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="catalog">
      <div class="catalog-head">
        <h1 class="brand" id="brand">武器图鉴</h1>
        <div class="game-switcher">
          <select id="gameSelect" aria-label="游戏选择"></select>
          <i data-lucide="chevron-down"></i>
        </div>
        <nav class="view-tabs" id="viewTabs" aria-label="图鉴类型">
          <a class="view-tab" id="creaturesLink" href="./index.html"><i data-lucide="users"></i>角色</a>
          <a class="view-tab" id="mapsLink" href="./maps.html"><i data-lucide="map"></i>地图</a>
          <a class="view-tab" id="soundsLink" href="./sounds.html"><i data-lucide="volume-2"></i>音效</a>
          <a class="view-tab active" id="weaponsLink" href="./weapons.html"><i data-lucide="crosshair"></i>武器</a>
          <a class="view-tab" id="propsLink" href="./props.html"><i data-lucide="package"></i>道具</a>
        </nav>
        <p class="edition" id="edition"></p>
        <label class="search">
          <i data-lucide="search"></i>
          <input id="searchInput" type="search" placeholder="搜索武器、角色或描述" autocomplete="off">
        </label>
        <div class="tier-filters" id="tierFilters"></div>
      </div>
      <div class="weapon-list" id="weaponList"></div>
    </aside>
    <main class="workspace">
      <section class="stage" id="stage">
        <div class="stage-head">
          <div class="identity"><h1 id="weaponName">加载中</h1><p id="weaponNameEn"></p></div>
          <div class="tier-badge" id="tierBadge">武器</div>
        </div>
        <div class="audition">
          <div class="audition-head">
            <button class="play-button" id="playButton" title="播放"><i data-lucide="play"></i></button>
            <div class="audition-info">
              <b id="audioTitle">选择一条音效试听</b>
              <span id="audioSubtitle"></span>
            </div>
          </div>
          <div class="transport">
            <input class="progress" id="progress" type="range" min="0" max="1000" value="0" aria-label="播放进度">
            <div class="times"><span id="currentTime">0:00</span><span id="durationTime">0:00</span></div>
          </div>
        </div>
        <div class="stage-tools">
          <div class="icon-tools">
            <button class="icon-button" id="loopButton" title="循环播放"><i data-lucide="repeat"></i></button>
            <button class="icon-button" id="stopButton" title="停止"><i data-lucide="square"></i></button>
          </div>
          <div class="icon-tools">
            <button class="icon-button" id="copyWeaponButton" title="复制该武器全部音效的引用"><i data-lucide="clipboard-copy"></i></button>
          </div>
        </div>
      </section>
      <section class="details">
        <div>
          <h2>武器信息</h2>
          <p id="summaryText"></p>
          <div class="stats">
            <div class="stat"><b id="characterStat">—</b><span>所属幸存者</span></div>
            <div class="stat"><b id="audioCountStat">—</b><span>音效条目</span></div>
            <div class="stat"><b id="clipCountStat">—</b><span>音频片段</span></div>
          </div>
          <div class="used-by" id="usedBy"></div>
        </div>
        <div>
          <h2>游戏内音效</h2>
          <p class="copy-hint">右上角按钮可一次复制该武器全部音效引用（原始效果名 + 中文名称 + 英文名称 + 文件地址），直接粘进表格或移植到其他游戏工程。</p>
          <div class="audio-list" id="audioList"></div>
          <div class="copy-preview" id="copyPreview" hidden></div>
        </div>
        <div class="hit-section">
          <h2>命中敌人后的效果</h2>
          <div class="hit-layout">
            <div>
              <div class="hit-canvas-wrap">
                <canvas class="hit-canvas" id="hitCanvas" width="640" height="360"></canvas>
                <div class="hit-badge" id="hitBadge">命中演示</div>
              </div>
              <div class="hit-tools">
                <button class="hit-button" id="hitPlayButton"><i data-lucide="play"></i>播放命中</button>
                <button class="hit-button" id="hitLoopButton"><i data-lucide="repeat"></i>循环</button>
                <button class="hit-button" id="hitRecordButton"><i data-lucide="video"></i>录制为视频</button>
              </div>
              <video class="hit-video" id="hitVideo" controls playsinline hidden></video>
            </div>
            <div>
              <div class="hit-meta" id="hitMeta"></div>
              <div class="hit-thumbs" id="hitThumbs"></div>
              <p class="hit-note" id="hitNote"></p>
            </div>
          </div>
        </div>
        <div class="notice" id="rightsNotice"></div>
      </section>
    </main>
  </div>
  <audio id="player" preload="metadata"></audio>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="importmap">
    {"imports":{"lucide":"https://cdn.jsdelivr.net/npm/lucide@0.468.0/+esm"}}
  </script>
  <script type="module">
    import { createIcons, Search, Play, Pause, Repeat, Square, Volume2, Users, ChevronDown, Crosshair, Copy, ClipboardCopy, Package, Video, Map as MapIcon } from 'lucide';

    const iconSet = { Search, Play, Pause, Repeat, Square, Volume2, Users, ChevronDown, Crosshair, Copy, ClipboardCopy, Package, Video, Map: MapIcon };
    const refreshIcons = () => createIcons({ icons: iconSet, attrs: { 'stroke-width': 1.8 } });
    refreshIcons();

    const games = await fetch('./games.json', { cache: 'no-store' }).then(response => response.json());
    const params = new URLSearchParams(location.search);
    const requestedGame = params.get('game');
    const requestedWeapon = params.get('weapon');
    const weaponGames = games.filter(game => game.weaponsCatalog);
    let activeGame = weaponGames.find(game => game.slug === requestedGame) ?? weaponGames[0] ?? null;
    if (!activeGame) {
      location.replace('./index.html');
      await new Promise(() => {});
    }

    const weaponData = await fetch(`./${activeGame.weaponsCatalog}?v=${activeGame.assetRevision}`, { cache: 'no-store' }).then(response => response.json());
    const weapons = weaponData.weapons ?? [];

    // 只有音效页的游戏，其 catalog 才是音效条目表；其它游戏的 catalog 是模型表，不能当音效用。
    let soundEntries = [];
    if (activeGame.soundsPage) {
      soundEntries = await fetch(`./${activeGame.catalog}?v=${activeGame.assetRevision}`, { cache: 'no-store' })
        .then(response => response.json()).catch(() => []);
    }
    const soundBySlug = new Map(soundEntries.map(entry => [entry.slug, entry]));

    let activeWeapon = weapons.find(weapon => weapon.slug === requestedWeapon) ?? weapons[0] ?? null;
    let activeAudioIndex = 0;
    let activeTier = '全部';
    const player = document.querySelector('#player');

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return '0:00';
      const total = Math.max(0, Math.round(seconds));
      const minutes = Math.floor(total / 60);
      const remain = String(total % 60).padStart(2, '0');
      return `${minutes}:${remain}`;
    }

    // 引用格式与音效页一致：制表符分隔，方便粘进表格后逐列解析。
    const REFERENCE_COLUMNS = ['原始效果名', '中文名称', '英文名称', '文件路径', '完整地址'];

    function weaponReferenceRows(weapon) {
      return weaponAudioEntries(weapon).flatMap(entry => (entry.clips ?? []).map(clip => [
        clip.name,
        entry.name,
        entry.nameEn,
        clip.file,
        new URL(clip.file, location.href).href,
      ].join('\t')));
    }

    let toastTimer = 0;
    function showToast(message) {
      const toast = document.querySelector('#toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1900);
    }

    // navigator.clipboard 只在安全上下文可用；用 localhost 打开时没问题，
    // 但用局域网 IP 或 file:// 打开会缺失，所以保留一个 execCommand 兜底。
    async function writeClipboard(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (error) {
        /* 落到下面的兜底实现 */
      }
      try {
        const scratch = document.createElement('textarea');
        scratch.value = text;
        scratch.setAttribute('readonly', '');
        scratch.style.position = 'fixed';
        scratch.style.top = '-1000px';
        document.body.appendChild(scratch);
        scratch.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(scratch);
        return ok;
      } catch (error) {
        return false;
      }
    }

    function weaponAudioEntries(weapon) {
      return (weapon?.audio ?? []).map(slug => soundBySlug.get(slug)).filter(Boolean);
    }

    function activeEntry() {
      return weaponAudioEntries(activeWeapon)[activeAudioIndex] ?? null;
    }

    function activeClip() {
      const entry = activeEntry();
      return entry?.clips?.[0] ?? null;
    }

    function setPlaying(playing) {
      document.querySelector('#playButton').innerHTML = `<i data-lucide="${playing ? 'pause' : 'play'}"></i>`;
      document.querySelector('#playButton').title = playing ? '暂停' : '播放';
      refreshIcons();
    }

    function renderTransport() {
      const entry = activeEntry();
      const clip = activeClip();
      document.querySelector('#audioTitle').textContent = entry ? entry.name : '该武器暂无收录音效';
      document.querySelector('#audioSubtitle').textContent = entry
        ? `${entry.nameEn} · ${entry.tier} · ${entry.clipCount} 条采样`
        : '音效目录中未关联到条目';
      document.querySelector('#progress').value = 0;
      document.querySelector('#currentTime').textContent = '0:00';
      document.querySelector('#durationTime').textContent = formatTime(clip?.durationSec ?? 0);
      if (!clip) {
        player.removeAttribute('src');
        setPlaying(false);
        return;
      }
      player.src = `${clip.file}?v=${activeGame.assetRevision}`;
      player.loop = Boolean(document.querySelector('#loopButton').classList.contains('active'));
      setPlaying(false);
    }

    function playActive(autoplay = false) {
      const clip = activeClip();
      if (!clip) return;
      if (!player.src || !player.src.endsWith(clip.file.split('/').pop())) {
        player.src = `${clip.file}?v=${activeGame.assetRevision}`;
      }
      if (autoplay) player.play().catch(() => setPlaying(false));
    }

    function renderWeaponDetails(weapon) {
      if (!weapon) return;
      document.querySelector('#weaponName').textContent = weapon.name;
      document.querySelector('#weaponNameEn').textContent = weapon.nameEn;
      document.querySelector('#tierBadge').textContent = weapon.character;
      document.querySelector('#summaryText').textContent = weapon.summary
        || '该武器暂无官方描述文本。';
      const entries = weaponAudioEntries(weapon);
      const clipTotal = entries.reduce((sum, entry) => sum + (entry.clipCount ?? entry.clips?.length ?? 0), 0);
      document.querySelector('#characterStat').textContent = weapon.character;
      document.querySelector('#audioCountStat').textContent = String(entries.length);
      document.querySelector('#clipCountStat').textContent = String(clipTotal);
      document.querySelector('#usedBy').innerHTML = [
        weapon.nameEn,
        weapon.characterEn,
        weapon.key,
      ].filter(Boolean).map(item => `<span class="chip">${item}</span>`).join('');
      document.querySelector('#rightsNotice').textContent = activeGame.notice
        ?? '武器资料与音效来自你本机的游戏安装，仅用于个人研究与 Wiki 原型。';

      const list = document.querySelector('#audioList');
      list.innerHTML = '';

      // 把按钮会复制到的全部内容显示出来，避免盲复制。
      const rows = weaponReferenceRows(weapon);
      const preview = document.querySelector('#copyPreview');
      preview.hidden = rows.length === 0;
      preview.textContent = rows.length
        ? `${REFERENCE_COLUMNS.join('  ·  ')}\n${rows.join('\n')}`
        : '';

      if (!entries.length) {
        list.innerHTML = '<div class="empty">该武器在音效目录中没有关联条目</div>';
        return;
      }
      entries.forEach((entry, index) => {
        const button = document.createElement('button');
        button.className = `audio-item${index === activeAudioIndex ? ' active' : ''}`;
        button.innerHTML = `<span class="audio-name">${entry.name}</span><span class="audio-meta">${entry.clipCount} 条 · ${formatTime(entry.durationSec)}</span><span class="audio-summary">${entry.summary}</span>`;
        button.addEventListener('click', () => {
          activeAudioIndex = index;
          renderWeaponDetails(weapon);
          renderTransport();
          playActive(true);
        });
        list.appendChild(button);
      });

      renderHitEffect(weapon);
    }

    function filteredWeapons() {
      const query = document.querySelector('#searchInput').value.trim().toLowerCase();
      return weapons.filter(weapon => {
        const tierMatch = activeTier === '全部' || weapon.character === activeTier;
        const haystack = [
          weapon.name, weapon.nameEn, weapon.character, weapon.characterEn,
          weapon.summary, weapon.summaryEn, weapon.key,
        ].join(' ').toLowerCase();
        return tierMatch && (!query || haystack.includes(query));
      });
    }

    function renderWeaponList() {
      const list = document.querySelector('#weaponList');
      list.innerHTML = '';
      const entries = filteredWeapons();
      if (!entries.length) {
        list.innerHTML = '<div class="empty">没有匹配武器</div>';
        return;
      }
      entries.forEach(weapon => {
        const button = document.createElement('button');
        button.className = `weapon-entry${weapon.slug === activeWeapon?.slug ? ' active' : ''}`;
        button.innerHTML = `<strong>${weapon.name}</strong><small>${weapon.nameEn}</small><span>${weapon.character}</span>`;
        button.addEventListener('click', () => {
          activeWeapon = weapon;
          activeAudioIndex = 0;
          const next = new URL(location.href);
          next.searchParams.set('game', activeGame.slug);
          next.searchParams.set('weapon', weapon.slug);
          history.replaceState({}, '', next);
          renderWeaponList();
          renderWeaponDetails(weapon);
          renderTransport();
        });
        list.appendChild(button);
      });
    }

    function renderTierFilters() {
      const container = document.querySelector('#tierFilters');
      const tiers = weaponData.characters?.map(item => item.name)
        ?? [...new Set(weapons.map(weapon => weapon.character))];
      container.innerHTML = '';
      ['全部', ...tiers].forEach(tier => {
        const button = document.createElement('button');
        button.className = `tier-filter${tier === activeTier ? ' active' : ''}`;
        button.textContent = tier;
        button.addEventListener('click', () => {
          activeTier = tier;
          renderTierFilters();
          renderWeaponList();
        });
        container.appendChild(button);
      });
    }

    function bindGameSelect() {
      const select = document.querySelector('#gameSelect');
      games.forEach(game => {
        const option = document.createElement('option');
        option.value = game.slug;
        option.textContent = `${game.name} / ${game.nameEn}`;
        select.appendChild(option);
      });
      select.value = activeGame.slug;
      select.addEventListener('change', event => {
        const nextGame = games.find(game => game.slug === event.target.value);
        if (!nextGame) return;
        if (nextGame.weaponsCatalog) {
          location.href = `./weapons.html?game=${encodeURIComponent(nextGame.slug)}`;
          return;
        }
        if (nextGame.soundsPage) {
          location.href = `./${nextGame.soundsPage}?game=${encodeURIComponent(nextGame.slug)}`;
          return;
        }
        location.href = `./index.html?game=${encodeURIComponent(nextGame.slug)}`;
      });
    }

    document.querySelector('#playButton').addEventListener('click', () => {
      if (!player.src) {
        playActive(true);
        return;
      }
      if (player.paused) player.play().catch(() => setPlaying(false));
      else player.pause();
    });
    document.querySelector('#stopButton').addEventListener('click', () => {
      player.pause();
      player.currentTime = 0;
      setPlaying(false);
    });
    document.querySelector('#loopButton').addEventListener('click', event => {
      const next = !event.currentTarget.classList.contains('active');
      event.currentTarget.classList.toggle('active', next);
      player.loop = next;
    });
    document.querySelector('#copyWeaponButton').addEventListener('click', async event => {
      const rows = weaponReferenceRows(activeWeapon);
      if (!rows.length) {
        showToast('该武器没有可复制的音效');
        return;
      }
      const ok = await writeClipboard([REFERENCE_COLUMNS.join('\t'), ...rows].join('\n'));
      if (!ok) {
        showToast('复制失败，请手动选中文本');
        return;
      }
      showToast(`已复制 ${rows.length} 条音效引用`);
      const button = event.currentTarget;
      button.classList.add('active');
      setTimeout(() => button.classList.remove('active'), 1200);
    });
    document.querySelector('#progress').addEventListener('input', event => {
      if (!player.duration) return;
      player.currentTime = (Number(event.target.value) / 1000) * player.duration;
    });
    document.querySelector('#searchInput').addEventListener('input', renderWeaponList);
    player.addEventListener('play', () => setPlaying(true));
    player.addEventListener('pause', () => setPlaying(false));
    player.addEventListener('ended', () => setPlaying(false));
    player.addEventListener('timeupdate', () => {
      document.querySelector('#currentTime').textContent = formatTime(player.currentTime);
      if (player.duration) {
        document.querySelector('#progress').value = String(Math.round((player.currentTime / player.duration) * 1000));
      }
    });
    player.addEventListener('loadedmetadata', () => {
      document.querySelector('#durationTime').textContent = formatTime(player.duration || activeClip()?.durationSec);
    });

    // ---------- 命中敌人后的效果演示 ----------
    // 贴图、颜色、音效都取自游戏原始资源；播放节奏是重建的，因为 IL2CPP 构建
    // 剥离了 ParticleSystem 的 type tree，粒子颜色/尺寸/速度无法读回。
    const hitCanvas = document.querySelector('#hitCanvas');
    const hitCtx = hitCanvas.getContext('2d');
    const HIT_W = hitCanvas.width;
    const HIT_H = hitCanvas.height;
    const HIT_DURATION = 0.95;
    const spriteCache = new Map();
    const hitAudio = new Audio();
    const HIT = { particles: [], startedAt: 0, running: false, looping: false, raf: 0, frameProcessed: -1 };

    function sprite(path) {
      if (!path) return null;
      if (!spriteCache.has(path)) {
        const img = new Image();
        img.src = `${path}?v=${activeGame.assetRevision}`;
        spriteCache.set(path, img);
      }
      return spriteCache.get(path);
    }

    function drawHitTarget() {
      const cx = HIT_W / 2;
      const cy = HIT_H / 2;
      const radial = hitCtx.createRadialGradient(cx, cy, 6, cx, cy, 150);
      radial.addColorStop(0, 'rgba(38, 52, 45, 1)');
      radial.addColorStop(1, 'rgba(14, 20, 17, 1)');
      hitCtx.fillStyle = radial;
      hitCtx.beginPath();
      hitCtx.arc(cx, cy, 92, 0, Math.PI * 2);
      hitCtx.fill();
      hitCtx.strokeStyle = 'rgba(120, 140, 128, .5)';
      hitCtx.lineWidth = 2;
      hitCtx.stroke();
      hitCtx.fillStyle = 'rgba(167, 177, 170, .55)';
      hitCtx.font = '12px Inter, "Microsoft YaHei", sans-serif';
      hitCtx.textAlign = 'center';
      hitCtx.fillText('敌人（占位示意）', cx, cy + 118);
    }

    function drawHitFrame(seconds) {
      const fx = activeWeapon?.hitEffect;
      hitCtx.clearRect(0, 0, HIT_W, HIT_H);
      drawHitTarget();
      if (!fx) return;
      const cx = HIT_W / 2;
      const cy = HIT_H / 2;

      hitCtx.save();
      hitCtx.translate(cx, cy);

      // 血雾：先放大后淡出，压在粒子下面
      const blood = fx.bloodSprite && sprite(fx.bloodSprite);
      if (blood?.complete && seconds < 0.55) {
        const k = seconds / 0.55;
        const size = 90 + k * 130;
        hitCtx.globalAlpha = Math.max(0, 1 - k) * 0.85;
        hitCtx.drawImage(blood, -size / 2, -size / 2, size, size);
      }

      // 撞击光点粒子：向外飞散并衰减
      hitCtx.globalCompositeOperation = 'lighter';
      const point = sprite(fx.impactSprite);
      for (const particle of HIT.particles) {
        const k = Math.min(1, particle.age / particle.life);
        if (k >= 1 || !point?.complete) continue;
        const x = particle.x + particle.vx * particle.age * (1 - k * 0.6);
        const y = particle.y + particle.vy * particle.age * (1 - k * 0.6) + 120 * particle.age * particle.age;
        const size = particle.size * (1 - k * 0.7);
        hitCtx.globalAlpha = (1 - k) * 0.9;
        hitCtx.drawImage(point, x - size / 2, y - size / 2, size, size);
      }
      hitCtx.globalAlpha = 1;

      // 逐帧命中球：8x8 精灵图，前 0.3 秒播完
      const sheet = fx.flipbookSprite && sprite(fx.flipbookSprite);
      if (sheet?.complete && seconds < 0.3) {
        const [cols, rows] = fx.flipbookGrid ?? [8, 8];
        const frameW = sheet.width / cols;
        const frameH = sheet.height / rows;
        const total = cols * rows;
        const frame = Math.min(total - 1, Math.floor((seconds / 0.3) * total));
        const sx = (frame % cols) * frameW;
        const sy = Math.floor(frame / cols) * frameH;
        const size = 210 * (1 - seconds * 0.5);
        hitCtx.globalAlpha = Math.max(0, 1 - seconds / 0.3) * 0.95;
        hitCtx.drawImage(sheet, sx, sy, frameW, frameH, -size / 2, -size / 2, size, size);
        hitCtx.globalAlpha = 1;
      }

      hitCtx.globalCompositeOperation = 'source-over';
      hitCtx.restore();
    }

    function stepHit(now) {
      HIT.raf = 0;
      if (!HIT.running) return;
      const seconds = (now - HIT.startedAt) / 1000;
      for (const particle of HIT.particles) particle.age = seconds;
      drawHitFrame(seconds);
      if (seconds < HIT_DURATION) {
        HIT.raf = requestAnimationFrame(stepHit);
        return;
      }
      if (HIT.looping) {
        triggerHit(false);
        return;
      }
      HIT.running = false;
      drawHitFrame(HIT_DURATION);
    }

    function triggerHit(withSound = true) {
      const fx = activeWeapon?.hitEffect;
      if (!fx) return;
      HIT.particles = [];
      for (let index = 0; index < 18; index += 1) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 70 + Math.random() * 230;
        HIT.particles.push({
          x: 0,
          y: 0,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 0.3 + Math.random() * 0.35,
          age: 0,
          size: 16 + Math.random() * 30,
        });
      }
      HIT.startedAt = performance.now();
      HIT.running = true;
      if (!HIT.raf) HIT.raf = requestAnimationFrame(stepHit);

      if (!withSound) return;
      const soundEntry = soundBySlug.get(fx.sound);
      const clip = soundEntry?.clips?.[0];
      if (!clip) return;
      hitAudio.src = `${clip.file}?v=${activeGame.assetRevision}`;
      hitAudio.play().catch(() => {});
    }

    function renderHitEffect(weapon) {
      const fx = weapon?.hitEffect;
      const meta = document.querySelector('#hitMeta');
      const thumbs = document.querySelector('#hitThumbs');
      const note = document.querySelector('#hitNote');
      const badge = document.querySelector('#hitBadge');
      meta.innerHTML = '';
      thumbs.innerHTML = '';
      HIT.running = false;
      HIT.looping = false;
      document.querySelector('#hitLoopButton').classList.remove('active');
      document.querySelector('#hitVideo').hidden = true;

      if (!fx) {
        badge.textContent = '无命中特效';
        note.textContent = '这把武器在游戏里没有单独的命中粒子，预览不可用。';
        drawHitFrame(0);
        return;
      }

      badge.textContent = `命中粒子 ${fx.particle}`;
      const rows = [
        ['命中粒子', fx.particle],
        ['粒子贴图', (fx.particleTextures ?? []).join('、') || '—'],
        ['命中类型', fx.kind],
        ['撞击颜色', fx.color],
        ['命中音效', soundBySlug.get(fx.sound)?.name ?? fx.sound],
      ];
      meta.innerHTML = rows
        .map(([label, value]) => `<div class="hit-line"><b>${label}</b><span>${value}</span></div>`)
        .join('');
      [fx.impactSprite, fx.bloodSprite, fx.flipbookSprite]
        .filter(Boolean)
        .forEach(path => {
          const cell = document.createElement('div');
          cell.className = 'hit-thumb';
          cell.style.backgroundImage = `url('${path}?v=${activeGame.assetRevision}')`;
          cell.title = path.split('/').pop();
          thumbs.appendChild(cell);
        });
      note.innerHTML = '贴图、颜色与音效取自游戏原始资源；<b>播放节奏是按游戏特效惯例重建的</b>'
        + '——IL2CPP 构建剥离了 ParticleSystem 的类型信息，粒子颜色、尺寸与速度无法读回。'
        + '点「录制为视频」可把这段动画导出为 WebM。';

      sprite(fx.impactSprite);
      sprite(fx.bloodSprite);
      sprite(fx.flipbookSprite);
      drawHitFrame(HIT_DURATION);
    }

    document.querySelector('#hitPlayButton').addEventListener('click', () => triggerHit(true));
    document.querySelector('#hitLoopButton').addEventListener('click', event => {
      HIT.looping = !HIT.looping;
      event.currentTarget.classList.toggle('active', HIT.looping);
      if (HIT.looping) triggerHit(true);
    });
    document.querySelector('#hitRecordButton').addEventListener('click', () => {
      const button = document.querySelector('#hitRecordButton');
      if (HIT.recorder) {
        HIT.recorder.stop();
        return;
      }
      if (typeof MediaRecorder === 'undefined' || !hitCanvas.captureStream) {
        showToast('当前浏览器不支持画布录制');
        return;
      }
      let stream;
      try {
        stream = hitCanvas.captureStream(30);
        HIT.recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      } catch (error) {
        showToast('无法启动录制');
        HIT.recorder = null;
        return;
      }
      const chunks = [];
      HIT.recorder.ondataavailable = event => {
        if (event.data?.size) chunks.push(event.data);
      };
      HIT.recorder.onstop = () => {
        hitCanvas.captureStream && stream.getTracks().forEach(track => track.stop());
        const blob = new Blob(chunks, { type: 'video/webm' });
        const video = document.querySelector('#hitVideo');
        video.src = URL.createObjectURL(blob);
        video.hidden = false;
        const link = document.createElement('a');
        link.href = video.src;
        link.download = `${activeWeapon?.slug ?? 'hit'}-hit.webm`;
        link.click();
        HIT.recorder = null;
        button.classList.remove('active');
        button.innerHTML = '<i data-lucide="video"></i>录制为视频';
        refreshIcons();
        showToast('已生成视频并开始下载');
      };
      HIT.recorder.start();
      button.classList.add('active');
      button.innerHTML = '<i data-lucide="square"></i>停止录制';
      refreshIcons();
      showToast('录制中，再次点击结束');
      HIT.looping = true;
      document.querySelector('#hitLoopButton').classList.add('active');
      triggerHit(true);
    });

    document.querySelector('#brand').textContent = `${activeGame.name} · 武器图鉴`;
    document.querySelector('#edition').textContent = activeGame.subtitle;
    const tabs = document.querySelector('#viewTabs');
    tabs.classList.toggle('models-available', Boolean(activeGame.catalog) && activeGame.defaultView !== 'sounds');
    tabs.classList.toggle('sounds-available', Boolean(activeGame.soundsPage));
    tabs.classList.toggle('maps-available', Boolean(activeGame.mapsPage));
    tabs.classList.toggle('props-available', Boolean(activeGame.propsCatalog));
    document.querySelector('#creaturesLink').href = `./index.html?game=${encodeURIComponent(activeGame.slug)}`;
    document.querySelector('#mapsLink').href = `./maps.html?game=${encodeURIComponent(activeGame.slug)}`;
    document.querySelector('#soundsLink').href = `./${activeGame.soundsPage ?? 'sounds.html'}?game=${encodeURIComponent(activeGame.slug)}`;
    document.querySelector('#propsLink').href = `./props.html?game=${encodeURIComponent(activeGame.slug)}`;
    document.title = `${activeGame.name} · 武器图鉴`;
    bindGameSelect();
    renderTierFilters();
    renderWeaponList();
    if (activeWeapon) {
      renderWeaponDetails(activeWeapon);
      renderTransport();
    }
  </script>
</body>
</html>
