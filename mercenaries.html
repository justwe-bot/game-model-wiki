<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101513">
  <title>霓虹佣兵 · 角色档案</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101513; --side: #151c19; --surface: #1a231f; --surface-2: #202b26;
      --line: #34413b; --line-soft: #27322d; --text: #f1f4ec; --muted: #a7b1aa;
      --faint: #748078; --lime: #bddb6b; --coral: #f08366; --amber: #efbb61;
      font-family: Inter, "Microsoft YaHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body { min-height: 100vh; overflow: hidden; }
    button, input, select { font: inherit; }
    button, a { color: inherit; }
    .app { height: 100vh; min-height: 0; overflow: hidden; display: grid; grid-template-columns: 292px minmax(0, 1fr); }
    .catalog { min-width: 0; min-height: 0; overflow: hidden; border-right: 1px solid var(--line); background: var(--side); display: flex; flex-direction: column; }
    .catalog-head { padding: 20px 16px 14px; border-bottom: 1px solid var(--line-soft); }
    .brand { margin: 0; font-size: 19px; font-weight: 800; }
    .edition { margin: 5px 0 16px; color: var(--muted); font-size: 12px; }
    .game-switcher { position: relative; margin: 14px 0 10px; }
    .game-switcher select { width: 100%; height: 38px; appearance: none; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--text); padding: 0 34px 0 11px; outline: 0; cursor: pointer; }
    .game-switcher svg { position: absolute; right: 10px; top: 11px; width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
    .view-tabs { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 10px; }
    .view-tab { flex: 1 1 72px; height: 34px; border: 1px solid var(--line); border-radius: 5px; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 7px; text-decoration: none; font-size: 12px; }
    .view-tab.active { color: #17200e; background: var(--lime); border-color: var(--lime); font-weight: 800; }
    .view-tab svg { width: 15px; height: 15px; }
    .search { height: 38px; display: flex; align-items: center; gap: 9px; padding: 0 11px; border: 1px solid var(--line); border-radius: 6px; background: #101613; }
    .search svg { width: 16px; height: 16px; color: var(--muted); flex: 0 0 auto; }
    .search input { width: 100%; min-width: 0; border: 0; outline: 0; color: var(--text); background: transparent; }
    .search input::placeholder { color: var(--faint); }
    .tier-filters { max-height: 86px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; margin-top: 10px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
    .tier-filter { border: 1px solid var(--line); border-radius: 5px; background: transparent; color: var(--muted); padding: 6px 9px; cursor: pointer; font-size: 12px; }
    .tier-filter.active { color: #17200e; background: var(--lime); border-color: var(--lime); font-weight: 800; }
    .prop-list { min-height: 0; flex: 1; padding: 10px; display: grid; align-content: start; gap: 5px; overflow-y: auto; overscroll-behavior: contain; }
    .prop-entry { min-height: 58px; width: 100%; border: 1px solid transparent; border-radius: 6px; background: transparent; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 10px; align-items: center; padding: 9px 10px; text-align: left; cursor: pointer; }
    .prop-entry:hover { background: var(--surface); }
    .prop-entry.active { background: var(--surface-2); border-color: var(--line); }
    .prop-entry strong, .prop-entry small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .prop-entry strong { font-size: 14px; }
    .prop-entry small { grid-column: 1; color: var(--muted); }
    .prop-entry span { grid-column: 2; grid-row: 1 / span 2; color: var(--lime); font-size: 11px; }
    .empty { color: var(--muted); padding: 20px 10px; font-size: 13px; }
    .workspace { min-width: 0; min-height: 0; height: 100vh; overflow-y: auto; overscroll-behavior: contain; display: grid; grid-template-rows: minmax(420px, 52vh) auto; }
    .stage { min-height: 420px; position: sticky; z-index: 2; top: 0; overflow: hidden; background:
      radial-gradient(circle at 18% 20%, rgba(189, 219, 107, .08), transparent 28%),
      radial-gradient(circle at 82% 78%, rgba(240, 131, 102, .08), transparent 26%),
      #0a100e; display: grid; place-items: center; }
    .stage-head { position: absolute; z-index: 3; top: 18px; left: 20px; right: 20px; display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; pointer-events: none; }
    .identity h1 { margin: 0; max-width: min(58vw, 640px); font-size: clamp(24px, 3.4vw, 42px); line-height: 1.05; overflow-wrap: anywhere; }
    .identity p { margin: 7px 0 0; color: var(--muted); font-size: 14px; }
    .tier-badge { padding: 7px 10px; border: 1px solid var(--line); border-radius: 5px; background: rgba(16, 21, 19, .86); color: var(--coral); font-size: 12px; white-space: nowrap; }
    .preview { width: 100%; height: 100%; display: grid; place-items: center; padding: 96px 24px 76px; }
    .preview img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
    .preview-card { text-align: center; color: var(--muted); font-size: 13px; line-height: 1.8; max-width: 420px; }
    .preview-card b { display: block; color: var(--text); font-size: 16px; margin-bottom: 6px; }
    .preview-tools { position: absolute; z-index: 4; left: 20px; right: 20px; bottom: 18px; display: flex; justify-content: space-between; gap: 12px; }
    .icon-tools { padding: 4px; border: 1px solid var(--line); border-radius: 6px; background: rgba(16, 21, 19, .88); display: flex; gap: 3px; }
    .icon-button { width: 34px; height: 34px; padding: 0; border: 0; border-radius: 4px; background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--muted); }
    .icon-button:hover { background: var(--surface-2); color: var(--text); }
    .icon-button:disabled { opacity: .35; cursor: default; }
    .icon-button:disabled:hover { background: transparent; color: var(--muted); }
    .icon-button svg { width: 17px; height: 17px; }
    .preview-counter { align-self: center; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: rgba(16, 21, 19, .88); color: var(--muted); font-size: 12px; }
    .details { border-top: 1px solid var(--line); padding: 24px clamp(20px, 3.5vw, 48px) 38px; display: grid; grid-template-columns: minmax(270px, .8fr) minmax(420px, 1.2fr); gap: 38px 50px; }
    .details h2 { margin: 0 0 10px; font-size: 18px; }
    .details h2 span { color: var(--faint); font-size: 13px; font-weight: 400; margin-left: 6px; }
    .details p { margin: 0; color: var(--muted); line-height: 1.7; }
    .details p.note { font-size: 12px; color: var(--faint); margin-top: 8px; }
    .stats { margin-top: 20px; border-top: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); display: grid; grid-template-columns: repeat(3, 1fr); }
    .stat { padding: 14px 10px 14px 0; min-width: 0; }
    .stat b { display: block; font-size: 19px; overflow: hidden; text-overflow: ellipsis; }
    .stat span { display: block; margin-top: 3px; color: var(--faint); font-size: 11px; }
    .used-by { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
    .chip { padding: 5px 8px; border: 1px solid var(--line); border-radius: 5px; color: var(--amber); font-size: 12px; }
    .chip.dim { color: var(--faint); }
    .tex-list { display: grid; gap: 8px; }
    .tex-row { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; align-items: baseline; padding: 9px 12px; border: 1px solid var(--line-soft); border-radius: 6px; }
    .tex-row b { font-size: 12px; color: var(--lime); font-weight: 700; }
    .tex-row span { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .tex-row.missing span { color: var(--faint); }
    .render-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .render-grid a { display: block; border: 1px solid var(--line-soft); border-radius: 6px; overflow: hidden; background: var(--surface); }
    .render-grid a:hover { border-color: var(--line); }
    .render-grid img { display: block; width: 100%; height: 110px; object-fit: cover; background: #0a100e; }
    .render-grid small { display: block; padding: 6px 8px; color: var(--faint); font-size: 11px; }
    .audio-weapon { border: 1px solid var(--line-soft); border-radius: 6px; margin-bottom: 8px; background: var(--surface); }
    .audio-weapon > summary { cursor: pointer; list-style: none; padding: 10px 12px; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; font-size: 13px; }
    .audio-weapon > summary::-webkit-details-marker { display: none; }
    .audio-weapon > summary b { color: var(--text); }
    .audio-weapon > summary small { color: var(--faint); font-size: 11px; }
    .audio-body { padding: 0 12px 12px; display: grid; gap: 10px; }
    .audio-event { border-top: 1px solid var(--line-soft); padding-top: 8px; }
    .audio-event > header { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; margin-bottom: 6px; }
    .audio-event h3 { margin: 0; font-size: 13px; font-weight: 600; }
    .audio-event small { color: var(--faint); font-size: 11px; }
    .audio-leaves { display: flex; flex-wrap: wrap; gap: 5px; }
    .leaf-button { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 5px; background: transparent; color: var(--muted); padding: 4px 8px; cursor: pointer; font-size: 11px; }
    .leaf-button:hover { background: var(--surface-2); color: var(--text); }
    .leaf-button.playing { color: #17200e; background: var(--lime); border-color: var(--lime); font-weight: 700; }
    .leaf-button svg { width: 12px; height: 12px; }
    @media (max-width: 900px) {
      body { overflow: visible; }
      .app { display: block; height: auto; min-height: 100vh; overflow: visible; }
      .catalog { overflow: visible; border-right: 0; border-bottom: 1px solid var(--line); }
      .catalog-head { padding: 13px 12px 10px; }
      .edition { display: none; }
      .brand { font-size: 17px; }
      .tier-filters { max-height: none; flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
      .prop-list { min-height: auto; flex: none; display: flex; overflow-x: auto; padding: 8px 10px 10px; scrollbar-width: none; }
      .prop-entry { flex: 0 0 210px; min-width: 210px; grid-template-columns: minmax(0, 1fr); }
      .prop-entry span { grid-column: 1; grid-row: auto; }
      .workspace { height: auto; overflow: visible; grid-template-rows: minmax(390px, 48vh) auto; }
      .stage { min-height: 390px; position: relative; }
      .details { grid-template-columns: 1fr; gap: 26px; }
    }
    @media (max-width: 560px) {
      .identity h1 { max-width: 70vw; font-size: 26px; }
      .stage-head, .preview-tools { left: 14px; right: 14px; }
      .details { padding: 20px 15px 30px; }
      .stat b { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="catalog">
      <div class="catalog-head">
        <h1 class="brand" id="brand">霓虹佣兵 · 角色档案</h1>
        <div class="game-switcher">
          <select id="gameSelect" aria-label="游戏选择"></select>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </div>
        <nav class="view-tabs" aria-label="图鉴类型">
          <span class="view-tab active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>角色档案</span>
        </nav>
        <p class="edition" id="edition"></p>
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="searchInput" type="search" placeholder="搜索角色、派系或外观" autocomplete="off">
        </label>
        <div class="tier-filters" id="tierFilters"></div>
      </div>
      <div class="prop-list" id="charList"></div>
    </aside>
    <main class="workspace">
      <section class="stage" id="stage">
        <div class="stage-head">
          <div class="identity"><h1 id="charName">加载中</h1><p id="charMeta"></p></div>
          <div class="tier-badge" id="statusBadge">未验收</div>
        </div>
        <div class="preview" id="preview"></div>
        <div class="preview-tools" id="previewTools" hidden>
          <div class="icon-tools">
            <button class="icon-button" id="prevRender" title="上一张预览"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
            <button class="icon-button" id="nextRender" title="下一张预览"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
          </div>
          <div class="preview-counter" id="previewCounter"></div>
        </div>
      </section>
      <section class="details">
        <div>
          <h2>角色信息</h2>
          <p id="summary"></p>
          <div class="stats">
            <div class="stat"><b id="filesStat">—</b><span>文件</span></div>
            <div class="stat"><b id="sizeStat">—</b><span>归档体积</span></div>
            <div class="stat"><b id="rendersStat">—</b><span>渲染预览</span></div>
          </div>
          <div class="used-by" id="identityChips"></div>
        </div>
        <div>
          <h2>分区统计</h2>
          <div class="tex-list" id="partitionList"></div>
        </div>
        <div>
          <h2>渲染预览 <span id="renderCount"></span></h2>
          <div class="render-grid" id="renderGrid"></div>
        </div>
        <div>
          <h2>动作录像 <span id="recordingCount"></span></h2>
          <div class="tex-list" id="recordingList"></div>
        </div>
        <div>
          <h2>武器音频 <span id="audioMeta"></span></h2>
          <p id="audioIntro"></p>
          <div id="weaponAudio"></div>
        </div>
      </section>
    </main>
  </div>
  <script type="module">
    const FACTION_CN = { Grizzly: '灰熊', Scorpion: '毒蝎', Dove: '白鸽' };
    const ROLE_CN = { officer: '军官', soldier: '士兵', leader: '首领', ranger: '游骑兵', tank: '重装' };
    const PARTITION_CN = {
      models: '模型', textures: '材质', rigs: '骨架', animations: '动画',
      weapons: '武器', renders: '渲染', recordings: '录像',
    };
    const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';

    const games = await fetch('./games.json', { cache: 'no-store' }).then(response => response.json());
    const params = new URLSearchParams(location.search);
    const archiveGames = games.filter(game => game.mercenariesPage);
    let activeGame = archiveGames.find(game => game.slug === params.get('game')) ?? archiveGames[0] ?? null;
    if (!activeGame) {
      location.replace('./index.html');
      await new Promise(() => {});
    }

    const catalogUrl = `./${activeGame.catalog}`;
    const BASE = catalogUrl.replace(/\/[^/]*$/, '');
    const catalog = await fetch(`${catalogUrl}?v=${activeGame.assetRevision}`, { cache: 'no-store' })
      .then(response => response.json());

    // ---------- view models ----------
    const seq = {};
    const chars = catalog.characters.map(ch => {
      const code = ch.faction;
      seq[code] = (seq[code] ?? 0) + 1;
      const identity = ch.identity ?? {};
      const roles = [];
      let level = '';
      let variant = '';
      for (const tok of String(identity.appearance ?? '').split('_')) {
        if (!tok) continue;
        const m = /^lvl?(\d+)$/.exec(tok);
        if (m) level = `L${m[1]}`;
        else if (/^\d+$/.test(tok)) variant = tok;
        else if (tok in ROLE_CN) roles.push(ROLE_CN[tok]);
      }
      const meta = [...roles, level, variant ? `变体 ${variant}` : ''].filter(Boolean).join(' · ');
      const renders = Array.isArray(ch.renders) ? ch.renders : [];
      const recordings = Array.isArray(ch.recordings)
        ? ch.recordings
        : Object.values(ch.recordings ?? {}).flat();
      return {
        raw: ch,
        slug: ch.slug,
        faction: code,
        factionCn: FACTION_CN[code] ?? code,
        name: `${FACTION_CN[code] ?? code} ${String(seq[code]).padStart(2, '0')}`,
        meta: meta || '角色外观',
        renders,
        recordings,
      };
    });

    const acceptance = catalog.acceptance ?? {};
    const weaponAudio = catalog.weaponAudio ?? {};
    let activeChar = chars.find(c => c.slug === params.get('char')) ?? chars[0] ?? null;
    let activeFaction = '全部';
    let activeRender = 0;
    let audioIndex = null;
    let audioLoading = null;
    const player = new Audio();
    let playingButton = null;

    // ---------- helpers ----------
    const fmtBytes = bytes => {
      if (!bytes) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
      return `${(bytes / 1024 ** i).toFixed(i >= 2 ? 1 : 0)} ${units[i]}`;
    };
    const mediaUrl = (char, rel, zone) => `${BASE}/${char.raw.path}/${zone}/${rel}`;

    // ---------- list & filters ----------
    function filteredChars() {
      const query = document.querySelector('#searchInput').value.trim().toLowerCase();
      return chars.filter(c => {
        if (activeFaction !== '全部' && c.faction !== activeFaction) return false;
        if (!query) return true;
        return `${c.name} ${c.meta} ${c.factionCn} ${c.slug}`.toLowerCase().includes(query);
      });
    }

    function renderList() {
      const list = document.querySelector('#charList');
      list.innerHTML = '';
      const entries = filteredChars();
      if (!entries.length) {
        list.innerHTML = '<div class="empty">没有匹配角色</div>';
        return;
      }
      entries.forEach(entry => {
        const button = document.createElement('button');
        button.className = `prop-entry${entry.slug === activeChar?.slug ? ' active' : ''}`;
        const strong = document.createElement('strong');
        strong.textContent = entry.name;
        const small = document.createElement('small');
        small.textContent = entry.meta;
        const span = document.createElement('span');
        span.textContent = entry.renders.length ? `${entry.renders.length} 图` : '无预览';
        button.append(strong, small, span);
        button.addEventListener('click', () => selectChar(entry));
        list.appendChild(button);
      });
    }

    function renderFilters() {
      const container = document.querySelector('#tierFilters');
      container.innerHTML = '';
      const factions = [...new Set(chars.map(c => c.faction))];
      ['全部', ...factions].forEach(fac => {
        const count = fac === '全部' ? chars.length : chars.filter(c => c.faction === fac).length;
        const button = document.createElement('button');
        button.className = `tier-filter${fac === activeFaction ? ' active' : ''}`;
        button.textContent = `${fac === '全部' ? '全部' : FACTION_CN[fac] ?? fac} ${count}`;
        button.addEventListener('click', () => {
          activeFaction = fac;
          renderFilters();
          renderList();
        });
        container.appendChild(button);
      });
    }

    // ---------- details ----------
    function renderPreview() {
      const box = document.querySelector('#preview');
      const tools = document.querySelector('#previewTools');
      box.innerHTML = '';
      if (!activeChar.renders.length) {
        tools.hidden = true;
        const card = document.createElement('div');
        card.className = 'preview-card';
        card.innerHTML = `<b>${activeChar.name}</b>${activeChar.meta}<br>该角色暂无渲染预览，可查看分区统计与下方资产列表。`;
        box.appendChild(card);
        return;
      }
      activeRender = Math.min(Math.max(activeRender, 0), activeChar.renders.length - 1);
      const img = document.createElement('img');
      img.src = mediaUrl(activeChar, activeChar.renders[activeRender], '06_renders');
      img.alt = `${activeChar.name} 预览 ${activeRender + 1}`;
      img.loading = 'lazy';
      box.appendChild(img);
      tools.hidden = false;
      document.querySelector('#previewCounter').textContent = `${activeRender + 1} / ${activeChar.renders.length}`;
      document.querySelector('#prevRender').disabled = activeRender === 0;
      document.querySelector('#nextRender').disabled = activeRender === activeChar.renders.length - 1;
    }

    function renderDetails() {
      const ch = activeChar;
      const raw = ch.raw;
      const identity = raw.identity ?? {};
      document.querySelector('#charName').textContent = ch.name;
      document.querySelector('#charMeta').textContent = `${ch.factionCn} · ${ch.meta}`;
      document.querySelector('#statusBadge').textContent = acceptance.charactersAccepted
        ? `已验收 ${acceptance.charactersAccepted}/${acceptance.charactersTotal}` : '未验收';
      document.querySelector('#summary').textContent =
        `源自分区归档的角色外观，含模型、材质、骨架、动画与武器；完整静态装配未通过验收，渲染与录像为过程产物。`;
      document.querySelector('#filesStat').textContent = raw.totals?.files ?? '—';
      document.querySelector('#sizeStat').textContent = fmtBytes(raw.totals?.bytes ?? 0);
      document.querySelector('#rendersStat').textContent = `${ch.renders.length} / ${ch.recordings.length}`;

      const chips = document.querySelector('#identityChips');
      chips.innerHTML = '';
      const chip = (label, value, dim = false) => {
        if (!value) return;
        const el = document.createElement('span');
        el.className = `chip${dim ? ' dim' : ''}`;
        el.textContent = `${label}：${value}`;
        chips.appendChild(el);
      };
      chip('派系', ch.factionCn);
      chip('体型', identity.bodyCode);
      chip('外观', identity.appearance, true);
      chip('默认外观', identity.defaultEntityAppearance, true);
      chip('目录', raw.path, true);

      const partitions = document.querySelector('#partitionList');
      partitions.innerHTML = '';
      Object.entries(raw.partitions ?? {}).forEach(([key, part]) => {
        const row = document.createElement('div');
        row.className = 'tex-row';
        const b = document.createElement('b');
        b.textContent = PARTITION_CN[key] ?? key;
        const span = document.createElement('span');
        span.textContent = `${part.path} · ${part.files} 个文件 · ${fmtBytes(part.bytes)}`;
        row.append(b, span);
        partitions.appendChild(row);
      });

      document.querySelector('#renderCount').textContent = ch.renders.length ? `共 ${ch.renders.length} 张` : '';
      const grid = document.querySelector('#renderGrid');
      grid.innerHTML = '';
      if (!ch.renders.length) {
        grid.innerHTML = '<div class="empty">暂无渲染预览</div>';
      }
      ch.renders.forEach((rel, i) => {
        const a = document.createElement('a');
        a.href = mediaUrl(ch, rel, '06_renders');
        a.target = '_blank';
        a.rel = 'noopener';
        const img = document.createElement('img');
        img.src = a.href;
        img.loading = 'lazy';
        img.alt = `预览 ${i + 1}`;
        const small = document.createElement('small');
        small.textContent = `预览 ${i + 1}`;
        a.append(img, small);
        grid.appendChild(a);
      });

      document.querySelector('#recordingCount').textContent = ch.recordings.length ? `共 ${ch.recordings.length} 段` : '';
      const recBox = document.querySelector('#recordingList');
      recBox.innerHTML = '';
      if (!ch.recordings.length) {
        recBox.innerHTML = '<div class="empty">暂无动作录像</div>';
      }
      ch.recordings.forEach((rel, i) => {
        const row = document.createElement('div');
        row.className = 'tex-row';
        const b = document.createElement('b');
        b.textContent = `录像 ${String(i + 1).padStart(2, '0')}`;
        const span = document.createElement('span');
        const a = document.createElement('a');
        a.href = mediaUrl(ch, rel, '07_recordings');
        a.textContent = '打开 MP4';
        a.target = '_blank';
        a.rel = 'noopener';
        span.appendChild(a);
        row.append(b, span);
        recBox.appendChild(row);
      });
    }

    function selectChar(entry) {
      activeChar = entry;
      activeRender = 0;
      const next = new URL(location.href);
      next.searchParams.set('game', activeGame.slug);
      next.searchParams.set('char', entry.slug);
      history.replaceState({}, '', next);
      renderList();
      renderPreview();
      renderDetails();
    }

    // ---------- weapon audio ----------
    async function ensureAudioIndex() {
      if (audioIndex) return audioIndex;
      if (!audioLoading) {
        audioLoading = fetch(`${BASE}/weapon_audio/audio_index.json?v=${activeGame.assetRevision}`, { cache: 'no-store' })
          .then(response => response.json());
      }
      audioIndex = await audioLoading;
      return audioIndex;
    }

    function stopPlayback() {
      player.pause();
      if (playingButton) {
        playingButton.classList.remove('playing');
        playingButton.innerHTML = ICON_PLAY;
        playingButton = null;
      }
    }

    async function renderWeaponAudio() {
      const box = document.querySelector('#weaponAudio');
      box.innerHTML = '<div class="empty">正在载入音频索引…</div>';
      const index = await ensureAudioIndex();
      box.innerHTML = '';
      index.weapons.forEach(weapon => {
        const details = document.createElement('details');
        details.className = 'audio-weapon';
        const summary = document.createElement('summary');
        const b = document.createElement('b');
        b.textContent = weapon.code;
        const small = document.createElement('small');
        small.textContent = `${weapon.events} 事件 · ${weapon.leaves} 叶`;
        summary.append(b, small);
        const body = document.createElement('div');
        body.className = 'audio-body';
        weapon.items.forEach(item => {
          const block = document.createElement('div');
          block.className = 'audio-event';
          const header = document.createElement('header');
          const h3 = document.createElement('h3');
          h3.textContent = item.label;
          const count = document.createElement('small');
          count.textContent = `${item.files.length} 叶`;
          header.append(h3, count);
          const leaves = document.createElement('div');
          leaves.className = 'audio-leaves';
          item.files.forEach((file, i) => {
            const button = document.createElement('button');
            button.className = 'leaf-button';
            button.innerHTML = `${ICON_PLAY}<span>叶 ${i + 1}</span>`;
            button.title = `${weapon.code} · ${item.label} · 叶 ${i + 1}`;
            button.addEventListener('click', () => {
              if (playingButton === button) {
                stopPlayback();
                return;
              }
              stopPlayback();
              player.src = `${BASE}/weapon_audio/${weapon.dir}/wav/${file}`;
              player.play().catch(() => {});
              button.classList.add('playing');
              button.innerHTML = `${ICON_PLAY}<span>播放中</span>`;
              playingButton = button;
            });
            leaves.appendChild(button);
          });
          block.append(header, leaves);
          body.appendChild(block);
        });
        details.append(summary, body);
        box.appendChild(details);
      });
      player.addEventListener('ended', stopPlayback);
      player.addEventListener('pause', () => {
        if (playingButton && player.ended) stopPlayback();
      });
    }

    // ---------- game switcher ----------
    function bindGameSelect() {
      const select = document.querySelector('#gameSelect');
      games.forEach(game => {
        const option = document.createElement('option');
        option.value = game.slug;
        option.textContent = game.name === game.nameEn ? game.name : `${game.name} / ${game.nameEn}`;
        select.appendChild(option);
      });
      select.value = activeGame.slug;
      select.addEventListener('change', event => {
        const nextGame = games.find(game => game.slug === event.target.value);
        if (!nextGame) return;
        if (nextGame.mercenariesPage) {
          location.href = `./${nextGame.mercenariesPage}?game=${encodeURIComponent(nextGame.slug)}`;
          return;
        }
        if (nextGame.modelsCatalog) {
          location.href = `./${nextGame.modelsPage ?? 'models.html'}?game=${encodeURIComponent(nextGame.slug)}`;
          return;
        }
        if (nextGame.propsCatalog) {
          location.href = `./props.html?game=${encodeURIComponent(nextGame.slug)}`;
          return;
        }
        if (nextGame.weaponsCatalog) {
          location.href = `./weapons.html?game=${encodeURIComponent(nextGame.slug)}`;
          return;
        }
        if (nextGame.soundsPage) {
          location.href = `./${nextGame.soundsPage}?game=${encodeURIComponent(nextGame.slug)}`;
          return;
        }
        location.href = `./index.html?game=${encodeURIComponent(nextGame.slug)}`;
      });
    }

    // ---------- boot ----------
    document.querySelector('#searchInput').addEventListener('input', renderList);
    document.querySelector('#prevRender').addEventListener('click', () => {
      activeRender = Math.max(activeRender - 1, 0);
      renderPreview();
    });
    document.querySelector('#nextRender').addEventListener('click', () => {
      activeRender = Math.min(activeRender + 1, activeChar.renders.length - 1);
      renderPreview();
    });
    document.querySelector('#audioIntro').textContent =
      `${weaponAudio.weapons ?? 0} 把武器的原始音频叶，${fmtBytes(weaponAudio.bytes ?? 0)}；选择器、随机化、增益与分层均未求值，从未人工试听（${weaponAudio.accepted === false ? '未验收' : '状态见 catalog'}）。点击武器展开事件与叶片。`;
    document.querySelector('#audioMeta').textContent =
      acceptance.weaponAudioAccepted !== undefined
        ? `通过 ${acceptance.weaponAudioAccepted}/${acceptance.weaponAudioTotal}` : '';
    document.querySelector('#brand').textContent = `${activeGame.name} · 角色档案`;
    document.querySelector('#edition').textContent = activeGame.subtitle;
    document.title = `${activeGame.name} · 角色档案`;

    bindGameSelect();
    renderFilters();
    renderList();
    if (activeChar) {
      renderPreview();
      renderDetails();
    }
    renderWeaponAudio();
  </script>
</body>
</html>
