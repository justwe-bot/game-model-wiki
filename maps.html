<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101513">
  <title>雨中冒险 2 · 3D 地图图鉴</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <style>
    :root {
      color-scheme: dark;
      --bg: #101513; --side: #151c19; --surface: #1a231f; --surface-2: #202b26;
      --line: #34413b; --line-soft: #27322d; --text: #f1f4ec; --muted: #a7b1aa;
      --faint: #748078; --lime: #bddb6b; --amber: #efbb61;
      font-family: Inter, "Microsoft YaHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body { min-height: 100vh; }
    button, input { font: inherit; }
    button, a { color: inherit; }
    .app { height: 100vh; min-height: 0; overflow: hidden; display: grid; grid-template-columns: 292px minmax(0, 1fr); }
    .catalog { min-width: 0; min-height: 0; overflow: hidden; border-right: 1px solid var(--line); background: var(--side); display: flex; flex-direction: column; }
    .catalog-head { padding: 18px 16px 14px; border-bottom: 1px solid var(--line-soft); }
    .brand { margin: 0; font-size: 19px; font-weight: 800; }
    .view-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin: 12px 0; }
    .view-tab { height: 34px; border: 1px solid var(--line); border-radius: 5px; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 7px; text-decoration: none; font-size: 12px; }
    .view-tab.active { color: #17200e; background: var(--lime); border-color: var(--lime); font-weight: 800; }
    .view-tab svg { width: 15px; height: 15px; }
    .search { height: 38px; display: flex; align-items: center; gap: 9px; padding: 0 11px; border: 1px solid var(--line); border-radius: 6px; background: #101613; }
    .search svg { width: 16px; height: 16px; color: var(--muted); flex: 0 0 auto; }
    .search input { width: 100%; min-width: 0; border: 0; outline: 0; color: var(--text); background: transparent; }
    .filters { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
    .filters::-webkit-scrollbar, .map-list::-webkit-scrollbar { display: none; }
    .filter { flex: 0 0 auto; border: 1px solid var(--line); border-radius: 5px; background: transparent; color: var(--muted); padding: 6px 9px; cursor: pointer; font-size: 12px; }
    .filter.active { color: #17200e; background: var(--lime); border-color: var(--lime); font-weight: 800; }
    .map-list { min-height: 0; flex: 1; padding: 10px; display: grid; align-content: start; gap: 5px; overflow-y: auto; }
    .map-entry { min-height: 62px; width: 100%; border: 1px solid transparent; border-radius: 6px; background: transparent; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 10px; align-items: center; padding: 9px 10px; text-align: left; cursor: pointer; }
    .map-entry:hover { background: var(--surface); }
    .map-entry.active { background: var(--surface-2); border-color: var(--line); }
    .map-entry strong, .map-entry small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .map-entry strong { font-size: 14px; }
    .map-entry small { grid-column: 1; color: var(--muted); }
    .map-entry span { grid-column: 2; grid-row: 1 / span 2; color: var(--lime); font-size: 10px; }
    .workspace { min-width: 0; min-height: 0; height: 100vh; overflow-y: auto; display: grid; grid-template-rows: minmax(520px, 68vh) auto; }
    .stage { min-height: 520px; position: relative; overflow: hidden; background: #09100d; }
    #mapCanvas { width: 100%; height: 100%; display: block; touch-action: none; }
    .stage-head { position: absolute; z-index: 3; top: 20px; left: 22px; right: 22px; display: flex; justify-content: space-between; gap: 18px; pointer-events: none; }
    .identity h1 { margin: 0; max-width: min(66vw, 820px); font-size: clamp(30px, 4.5vw, 56px); line-height: 1; overflow-wrap: anywhere; }
    .identity p { margin: 7px 0 0; color: var(--muted); font-size: 14px; }
    .stage-badge { flex: 0 0 auto; padding: 7px 10px; border: 1px solid var(--line); border-radius: 5px; background: rgba(16, 21, 19, .88); color: var(--lime); font-size: 12px; }
    .tools { position: absolute; z-index: 4; right: 20px; bottom: 18px; padding: 4px; border: 1px solid var(--line); border-radius: 6px; background: rgba(16, 21, 19, .9); display: flex; gap: 3px; }
    .icon-button { width: 38px; height: 38px; border: 0; border-radius: 4px; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
    .icon-button:hover, .icon-button.active { color: var(--text); background: var(--surface-2); }
    .icon-button svg { width: 18px; height: 18px; }
    .loading { position: absolute; z-index: 5; inset: 0; display: grid; place-items: center; color: var(--muted); background: rgba(9, 16, 13, .76); pointer-events: none; }
    .loading.hidden { display: none; }
    .details { border-top: 1px solid var(--line); padding: 25px clamp(20px, 4vw, 54px) 38px; display: grid; grid-template-columns: minmax(280px, .8fr) minmax(420px, 1.2fr); gap: 35px 54px; }
    .details h2 { margin: 0 0 10px; font-size: 18px; }
    .details p { margin: 0; color: var(--muted); line-height: 1.7; }
    .stats { margin-top: 20px; border-top: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .stat { padding: 14px 8px 14px 0; min-width: 0; }
    .stat b { display: block; font-size: 19px; overflow: hidden; text-overflow: ellipsis; }
    .stat span { display: block; margin-top: 3px; color: var(--faint); font-size: 11px; }
    .method { border-left: 2px solid var(--amber); padding-left: 16px; align-self: start; }
    .method strong { display: block; margin-bottom: 8px; font-size: 14px; }
    .method code { color: var(--lime); }
    .notice { grid-column: 1 / -1; padding-top: 14px; border-top: 1px solid var(--line-soft); color: var(--faint); font-size: 11px; }
    .empty { padding: 18px 10px; color: var(--muted); }
    @media (max-width: 900px) {
      .app { display: block; height: auto; min-height: 100vh; overflow: visible; }
      .catalog { overflow: visible; border-right: 0; border-bottom: 1px solid var(--line); }
      .catalog-head { padding: 13px 12px 10px; }
      .brand { font-size: 17px; }
      .view-tabs { margin: 9px 0; }
      .map-list { min-height: auto; flex: none; display: flex; overflow-x: auto; padding: 8px 10px 10px; scrollbar-width: none; }
      .map-entry { min-width: 190px; }
      .workspace { height: auto; overflow: visible; grid-template-rows: minmax(440px, 60vh) auto; }
      .stage { min-height: 440px; }
      .details { grid-template-columns: 1fr; gap: 26px; }
    }
    @media (max-width: 560px) {
      .identity h1 { max-width: 73vw; font-size: 30px; }
      .stage-head { top: 15px; left: 15px; right: 15px; }
      .tools { right: 10px; bottom: 10px; }
      .details { padding: 20px 15px 30px; }
      .stat b { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="catalog">
      <div class="catalog-head">
        <h1 class="brand">雨中冒险 2 · 3D 图鉴</h1>
        <nav class="view-tabs" aria-label="图鉴类型">
          <a class="view-tab" href="./index.html?game=risk-of-rain-2"><i data-lucide="skull"></i>生物</a>
          <a class="view-tab active" href="./maps.html"><i data-lucide="map"></i>地图</a>
        </nav>
        <label class="search"><i data-lucide="search"></i><input id="searchInput" type="search" placeholder="搜索地图" autocomplete="off"></label>
        <div class="filters" id="filters"></div>
      </div>
      <div class="map-list" id="mapList"></div>
    </aside>
    <main class="workspace">
      <section class="stage" id="stage">
        <div class="stage-head">
          <div class="identity"><h1 id="mapName">载入地图</h1><p id="mapNameEn"></p></div>
          <div class="stage-badge" id="stageBadge">3D</div>
        </div>
        <canvas id="mapCanvas"></canvas>
        <div class="loading" id="loading">正在载入地图结构…</div>
        <div class="tools">
          <button class="icon-button" id="rotateButton" title="自动旋转"><i data-lucide="rotate-3d"></i></button>
          <button class="icon-button" id="topButton" title="俯视地图"><i data-lucide="move-up"></i></button>
          <button class="icon-button" id="resetButton" title="重置视角"><i data-lucide="rotate-ccw"></i></button>
        </div>
      </section>
      <section class="details">
        <div>
          <h2>地图信息</h2>
          <p id="summary"></p>
          <div class="stats">
            <div class="stat"><b id="sourceTriangles">—</b><span>提取三角面</span></div>
            <div class="stat"><b id="mapTriangles">—</b><span>展示三角面</span></div>
            <div class="stat"><b id="mapSize">—</b><span>模型大小</span></div>
          </div>
        </div>
        <div class="method">
          <strong id="methodTitle">结构预览模式</strong>
          <p id="methodText">从 Unity 关卡场景的静态组合网格生成，只收录结构可辨认的场景，并保留真实布局和高度顺序；极端纵深会为展示适度压缩。运行时拼装地图、天空盒、粒子、动态机关、植被实例与烘焙光照暂不包含。</p>
        </div>
        <div class="notice">地图与模型来自你本机的游戏安装，仅用于个人研究和 Wiki 原型。公开发布前请核对素材许可，不要分发原始 bundle、OBJ 或完整场景资源。</div>
      </section>
    </main>
  </div>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/","lucide":"https://cdn.jsdelivr.net/npm/lucide@0.468.0/+esm"}}
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { createIcons, Map, Skull, Search, Rotate3d, RotateCcw, MoveUp } from 'lucide';

    const assetRevision = '20260731-27';
    const catalog = await fetch(`./map-catalog.json?v=${assetRevision}`, { cache: 'no-store' }).then(response => response.json());
    const canvas = document.querySelector('#mapCanvas');
    const stage = document.querySelector('#stage');
    const loading = document.querySelector('#loading');
    createIcons({ icons: { Map, Skull, Search, Rotate3d, RotateCcw, MoveUp }, attrs: { 'stroke-width': 1.8 } });

    const compact = window.matchMedia('(max-width: 900px)').matches;
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: !compact });
    renderer.setPixelRatio(Math.min(devicePixelRatio, compact ? 1 : 1.5));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.setClearColor(0x09100d, 1);
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x09100d, 13, 32);
    scene.add(new THREE.HemisphereLight(0xe7efd4, 0x203129, 1.35));
    const key = new THREE.DirectionalLight(0xffd6ad, 1.85); key.position.set(8, 12, 6); scene.add(key);
    const fill = new THREE.DirectionalLight(0xb7d7e0, 0.7); fill.position.set(-8, 5, 4); scene.add(fill);
    const camera = new THREE.PerspectiveCamera(34, 1, 0.01, 100);
    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true; controls.enablePan = false; controls.minDistance = 4; controls.maxDistance = 24;
    const loader = new GLTFLoader();
    const textureLoader = new THREE.TextureLoader();
    const terrainTextureCache = new globalThis.Map();
    const clock = new THREE.Clock();
    let activeEntry = catalog[0];
    let activeExpansion = '全部';
    let activeRoot = null;
    let rotating = !compact;
    let stageVisible = true;
    const mapView = { center: new THREE.Vector3(0, 0.8, 0), radius: 5 };

    document.querySelector('#rotateButton').classList.toggle('active', rotating);
    new IntersectionObserver(([entry]) => { stageVisible = entry.isIntersecting; }, { threshold: 0.03 }).observe(stage);

    function resize() {
      const width = stage.clientWidth, height = stage.clientHeight;
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }

    function disposeRoot() {
      if (!activeRoot) return;
      scene.remove(activeRoot);
      activeRoot.traverse(object => {
        if (!object.isMesh) return;
        object.geometry?.dispose();
        const materials = Array.isArray(object.material) ? object.material : [object.material];
        materials.forEach(material => material?.dispose());
      });
      activeRoot = null;
    }

    function fitDistance(multiplier = 1.18) {
      const verticalFov = THREE.MathUtils.degToRad(camera.fov);
      const horizontalFov = 2 * Math.atan(Math.tan(verticalFov / 2) * camera.aspect);
      const limitingFov = Math.min(verticalFov, horizontalFov);
      return (mapView.radius / Math.sin(limitingFov / 2)) * multiplier;
    }

    function applyCameraRange(distance) {
      camera.near = Math.max(0.01, distance / 500);
      camera.far = Math.max(100, distance + mapView.radius * 8);
      camera.updateProjectionMatrix();
      controls.minDistance = Math.max(1.2, mapView.radius * 0.45);
      controls.maxDistance = Math.max(24, distance * 2.5);
      scene.fog.near = Math.max(10, distance * 0.75);
      scene.fog.far = Math.max(scene.fog.near + 12, distance + mapView.radius * 3.2);
    }

    function resetCamera() {
      if (activeRoot) activeRoot.rotation.set(0, 0, 0);
      const distance = fitDistance(compact ? 1.0 : 0.88);
      const direction = new THREE.Vector3(1, compact ? 0.72 : 0.64, 1).normalize();
      controls.target.copy(mapView.center);
      camera.position.copy(mapView.center).addScaledVector(direction, distance);
      applyCameraRange(distance);
      controls.update();
    }

    function topView() {
      if (activeRoot) activeRoot.rotation.set(0, 0, 0);
      const distance = fitDistance(compact ? 1.08 : 0.96);
      controls.target.copy(mapView.center);
      camera.position.copy(mapView.center).add(new THREE.Vector3(0.01, distance, 0.01));
      applyCameraRange(distance);
      controls.update();
    }

    function fitMap(root) {
      const box = new THREE.Box3().setFromObject(root);
      const size = box.getSize(new THREE.Vector3());
      const scale = 7.2 / Math.max(size.x, size.z, size.y * 0.55, 0.001);
      const horizontalSize = Math.max(size.x, size.z, 0.001);
      const heightCompression = Math.min(1, (horizontalSize * 0.65) / Math.max(size.y, 0.001));
      root.scale.set(scale, scale * heightCompression, scale);
      const scaledBox = new THREE.Box3().setFromObject(root);
      const center = scaledBox.getCenter(new THREE.Vector3());
      root.position.x -= center.x;
      root.position.z -= center.z;
      root.position.y -= scaledBox.min.y;
      const fittedBox = new THREE.Box3().setFromObject(root);
      const sphere = fittedBox.getBoundingSphere(new THREE.Sphere());
      mapView.center.copy(sphere.center);
      mapView.radius = Math.max(sphere.radius, 1);
    }

    async function loadTerrainTextures(entry) {
      if (terrainTextureCache.has(entry.slug)) return terrainTextureCache.get(entry.slug);
      const texturePaths = entry.textures.rockSide
        ? {
            rockSide: entry.textures.rockSide,
            rockTop: entry.textures.rockTop,
            grass: entry.textures.grass,
            dirt: entry.textures.dirt,
          }
        : {
            rockSide: entry.textures.rock,
            rockTop: entry.textures.rock,
            grass: entry.textures.grass,
            dirt: entry.textures.lichen,
          };
      const promise = Promise.all(Object.entries(texturePaths).map(async ([key, path]) => {
        const texture = await textureLoader.loadAsync(`${path}?v=${assetRevision}`);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.anisotropy = compact ? 2 : 4;
        texture.needsUpdate = true;
        return [key, texture];
      })).then(pairs => Object.fromEntries(pairs));
      terrainTextureCache.set(entry.slug, promise);
      return promise;
    }

    function createTerrainMaterial(textures, entry) {
      const material = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        side: THREE.DoubleSide,
        toneMapped: false,
      });
      material.onBeforeCompile = shader => {
        shader.uniforms.terrainRockSide = { value: textures.rockSide };
        shader.uniforms.terrainRockTop = { value: textures.rockTop };
        shader.uniforms.terrainGrass = { value: textures.grass };
        shader.uniforms.terrainDirt = { value: textures.dirt };
        shader.uniforms.terrainSingleLayer = { value: entry.textureMode === 'dirt-only' ? 1 : 0 };
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', `#include <common>
attribute vec4 color;
varying vec3 vTerrainBlend;
varying vec3 vTerrainPosition;
varying vec3 vTerrainNormal;`)
          .replace('#include <begin_vertex>', `#include <begin_vertex>
vTerrainBlend = color.rgb;
vTerrainPosition = position;
vTerrainNormal = normal;`);
        shader.fragmentShader = shader.fragmentShader
          .replace('#include <common>', `#include <common>
uniform sampler2D terrainRockSide;
uniform sampler2D terrainRockTop;
uniform sampler2D terrainGrass;
uniform sampler2D terrainDirt;
uniform float terrainSingleLayer;
varying vec3 vTerrainBlend;
varying vec3 vTerrainPosition;
varying vec3 vTerrainNormal;

vec3 sampleTerrainTriplanar(sampler2D terrainTexture, vec3 position, vec3 normal, float scale) {
  vec3 projection = pow(abs(normalize(normal)), vec3(4.0));
  projection /= max(projection.x + projection.y + projection.z, 0.0001);
  vec3 alongX = texture2D(terrainTexture, fract(position.zy * scale)).rgb;
  vec3 alongY = texture2D(terrainTexture, fract(position.xz * scale)).rgb;
  vec3 alongZ = texture2D(terrainTexture, fract(position.xy * scale)).rgb;
  return alongX * projection.x + alongY * projection.y + alongZ * projection.z;
}

vec3 sampleTerrainLayer(sampler2D terrainTexture, vec3 position, vec3 normal, float scale) {
  vec3 primary = sampleTerrainTriplanar(terrainTexture, position, normal, scale);
#ifdef MOBILE_TERRAIN
  return primary;
#else
  vec3 secondary = sampleTerrainTriplanar(
    terrainTexture,
    position + vec3(1.73, 0.61, 2.19),
    normal,
    scale * 2.65
  );
  float secondaryValue = dot(secondary, vec3(0.2126, 0.7152, 0.0722));
  return clamp(primary * mix(0.9, 1.12, secondaryValue), 0.0, 1.0);
#endif
}`)
          .replace('#include <color_fragment>', `#include <color_fragment>
vec3 terrainWeights = max(vTerrainBlend, vec3(0.0));
float terrainWeightSum = terrainWeights.r + terrainWeights.g + terrainWeights.b;
if (terrainWeightSum < 0.001) {
  float upwardFacing = clamp(abs(normalize(vTerrainNormal).y), 0.0, 1.0);
  float fallbackGrass = smoothstep(0.48, 0.78, upwardFacing);
  terrainWeights = vec3(1.0 - fallbackGrass, fallbackGrass, 0.0);
} else {
  terrainWeights /= terrainWeightSum;
}
float rockTopWeight = pow(clamp(abs(normalize(vTerrainNormal).y), 0.0, 1.0), 3.0);
vec3 rockSideColor = sampleTerrainLayer(terrainRockSide, vTerrainPosition, vTerrainNormal, 0.24);
vec3 rockTopColor = sampleTerrainLayer(terrainRockTop, vTerrainPosition, vTerrainNormal, 0.24);
vec3 rockColor = mix(rockSideColor, rockTopColor, rockTopWeight) * 1.12;
vec3 grassColor = sampleTerrainLayer(terrainGrass, vTerrainPosition, vTerrainNormal, 0.38) * 1.08;
vec3 dirtColor = sampleTerrainLayer(terrainDirt, vTerrainPosition, vTerrainNormal, 0.22) * 0.96;
vec3 terrainColor = rockColor * terrainWeights.r + grassColor * terrainWeights.g + dirtColor * terrainWeights.b;
terrainColor = mix(terrainColor, dirtColor, terrainSingleLayer);
#ifndef MOBILE_TERRAIN
vec3 surfaceDetail = sampleTerrainTriplanar(
  terrainDirt,
  vTerrainPosition + vec3(3.17, 1.29, 0.83),
  vTerrainNormal,
  0.82
);
float detailValue = dot(surfaceDetail, vec3(0.2126, 0.7152, 0.0722));
terrainColor *= mix(0.92, 1.12, smoothstep(0.08, 0.72, detailValue));
#endif
diffuseColor.rgb = terrainColor * 1.28;`);
      };
      if (compact) material.defines = { MOBILE_TERRAIN: 1 };
      material.customProgramCacheKey = () => `ror2-terrain-triplanar-v9-${compact ? 'mobile' : 'desktop'}`;
      return material;
    }

    async function loadMap(entry) {
      loading.textContent = '正在载入地图结构…';
      loading.classList.remove('hidden');
      disposeRoot();
      try {
        const texturePromise = entry.materialMode?.startsWith('triplanar-game-textures')
          ? loadTerrainTextures(entry)
          : Promise.resolve(null);
        const [gltf, terrainTextures] = await Promise.all([
          loader.loadAsync(`${entry.model}?v=${assetRevision}`),
          texturePromise,
        ]);
        const root = gltf.scene;
        const terrainMaterial = terrainTextures ? createTerrainMaterial(terrainTextures, entry) : null;
        root.traverse(object => {
          if (!object.isMesh) return;
          if (!object.geometry.getAttribute('normal')) object.geometry.computeVertexNormals();
          if (terrainMaterial) {
            object.material = terrainMaterial;
          } else {
            object.material = new THREE.MeshStandardMaterial({
              color: entry.palette.high,
              roughness: 0.92,
              metalness: 0,
              side: THREE.DoubleSide,
            });
          }
          object.frustumCulled = false;
        });
        fitMap(root);
        scene.add(root);
        activeRoot = root;
        canvas.dataset.loadedMap = entry.slug;
        resetCamera();
        renderer.render(scene, camera);
        loading.classList.add('hidden');
      } catch (error) {
        console.error(error);
        loading.textContent = '地图载入失败，请切换条目重试';
      }
    }

    function renderDetails(entry) {
      document.querySelector('#mapName').textContent = entry.name;
      document.querySelector('#mapNameEn').textContent = `${entry.nameEn} · ${entry.expansion}`;
      document.querySelector('#stageBadge').textContent = entry.stage;
      document.querySelector('#summary').textContent = entry.summary;
      document.querySelector('#sourceTriangles').textContent = entry.sourceTriangles.toLocaleString();
      document.querySelector('#mapTriangles').textContent = entry.mapTriangles.toLocaleString();
      document.querySelector('#mapSize').textContent = `${entry.sizeKB.toLocaleString()} KB`;
      const restored = entry.materialMode?.startsWith('triplanar-game-textures');
      document.querySelector('#methodTitle').textContent = restored ? '主题材质还原' : '结构预览模式';
      document.querySelector('#methodText').textContent = restored
        ? '从本机 Unity 地形预制体重建，并实时混合岩石侧面、岩石顶面、草地和泥土原始纹理；保留完整地形轮廓，单次只加载当前地图。'
        : '从 Unity 关卡场景的静态组合网格生成，只收录结构可辨认的场景，并保留真实布局和高度顺序；极端纵深会为展示适度压缩。运行时拼装地图、天空盒、粒子、动态机关、植被实例与烘焙光照暂不包含。';
    }

    function filteredCatalog() {
      const query = document.querySelector('#searchInput').value.trim().toLowerCase();
      return catalog.filter(entry => {
        const expansionMatch = activeExpansion === '全部' || entry.expansion === activeExpansion;
        const textMatch = !query || entry.name.toLowerCase().includes(query) || entry.nameEn.toLowerCase().includes(query) || entry.scene.includes(query);
        return expansionMatch && textMatch;
      });
    }

    function renderList() {
      const list = document.querySelector('#mapList');
      const entries = filteredCatalog();
      list.innerHTML = '';
      if (!entries.length) { list.innerHTML = '<div class="empty">没有匹配地图</div>'; return; }
      entries.forEach(entry => {
        const button = document.createElement('button');
        button.className = `map-entry${entry.slug === activeEntry.slug ? ' active' : ''}`;
        button.innerHTML = `<strong>${entry.name}</strong><small>${entry.nameEn}</small><span>${entry.stage}</span>`;
        button.addEventListener('click', async () => {
          activeEntry = entry; renderList(); renderDetails(entry); await loadMap(entry);
        });
        list.appendChild(button);
      });
    }

    function renderFilters() {
      const values = ['全部', ...new Set(catalog.map(entry => entry.expansion))];
      const filters = document.querySelector('#filters');
      values.forEach(value => {
        const button = document.createElement('button');
        button.className = `filter${value === activeExpansion ? ' active' : ''}`;
        button.textContent = value;
        button.addEventListener('click', () => {
          activeExpansion = value;
          document.querySelectorAll('.filter').forEach(item => item.classList.toggle('active', item === button));
          renderList();
        });
        filters.appendChild(button);
      });
    }

    document.querySelector('#searchInput').addEventListener('input', renderList);
    document.querySelector('#rotateButton').addEventListener('click', event => {
      rotating = !rotating; event.currentTarget.classList.toggle('active', rotating);
    });
    document.querySelector('#topButton').addEventListener('click', topView);
    document.querySelector('#resetButton').addEventListener('click', resetCamera);

    function animate() {
      requestAnimationFrame(animate);
      if (!stageVisible || document.hidden) { clock.getDelta(); return; }
      const delta = Math.min(clock.getDelta(), 0.05);
      if (rotating && activeRoot) activeRoot.rotation.y += delta * 0.16;
      controls.update();
      renderer.render(scene, camera);
    }

    new ResizeObserver(resize).observe(stage);
    resize(); renderFilters(); renderList(); renderDetails(activeEntry); await loadMap(activeEntry); animate();
  </script>
</body>
</html>
